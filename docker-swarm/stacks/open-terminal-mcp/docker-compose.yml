# Fase 4 (docs/31-docker-swarm.md): open-terminal-mcp migrado al swarm.
#
# `constraints: node.hostname==retaco` RETIRADO (2026-08-31, decisión
# explícita del usuario). `/home/user` (workspace de las sesiones de shell
# del LLM) -- comprobado en vivo que solo tenía el scaffolding por defecto
# (`.bashrc`/`.profile`/`.local`, 32K, nada creado en sesiones reales) --
# migrado a `/mnt/nfs-data/open-terminal-mcp/home` (verificado por recuento
# de ficheros). Se elige NFS y no `tmpfs` a propósito -- a diferencia de
# `bifrost`, este directorio SÍ podría acumular contenido real en futuras
# sesiones de terminal, conviene que sobreviva a un reinicio. Corre como
# root (`uid=0`), sin problema de ACL. El binario de `infisical` pasa a la
# ruta compartida multi-arquitectura (mismo mecanismo que `authentik`/
# `bifrost`/etc.).
#
# Mejora 47 (2026-09-03): el bind-mount pasa a volumen Docker
# `driver: local` + `driver_opts: type: nfs` -- mismo dato real en el NAS,
# mismo mecanismo que el resto de esta pasada. `vers=3` obligatorio.
version: "3.8"

services:
  open-terminal-mcp:
    image: registry.404labo.net/open-terminal-mcp:latest
    environment:
      # Mejora 41 (2026-08-28): cert real de Let's Encrypt, pero SSL_CERT_FILE
      # SIGUE haciendo falta -- esta imagen no trae ningún almacén de CAs del
      # sistema (hallazgo real, ver apikey-service). homelab-ca.crt pasa a
      # ser un bundle combinado (CA interna + almacén público estándar).
      INFISICAL_DOMAIN: https://infisical.404labo.net/api
      SSL_CERT_FILE: /etc/ssl/certs/homelab-ca.crt
    volumes:
      - open-terminal-mcp-home:/home/user
      - /srv/homelab/infisical/infisical-cli/infisical:/usr/local/bin/infisical:ro
    configs:
      # homelab-ca-bundle-v1: compartido con 10 stacks más (2026-08-31,
      # confirmado por md5sum idéntico) -- ver docker-swarm/stacks/authentik/
      # docker-compose.yml para la explicación completa.
      - source: homelab-ca-bundle-v1
        target: /etc/ssl/certs/homelab-ca.crt
    secrets:
      - source: open-terminal-mcp-infisical-client-id-v1
        target: open-terminal-mcp-infisical-client-id
      - source: open-terminal-mcp-infisical-client-secret-v1
        target: open-terminal-mcp-infisical-client-secret
      - source: open-terminal-mcp-infisical-project-id-v1
        target: open-terminal-mcp-infisical-project-id
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        CLIENT_ID=$$(cat /run/secrets/open-terminal-mcp-infisical-client-id) &&
        CLIENT_SECRET=$$(cat /run/secrets/open-terminal-mcp-infisical-client-secret) &&
        PROJECT_ID=$$(cat /run/secrets/open-terminal-mcp-infisical-project-id) &&
        TOKEN=$$(infisical login --method=universal-auth \
          --client-id="$$CLIENT_ID" \
          --client-secret="$$CLIENT_SECRET" \
          --plain --silent) &&
        exec infisical run --token="$$TOKEN" --projectId="$$PROJECT_ID" --env=prod --path=/open-terminal-mcp/ -- \
          tini -- /app/entrypoint-slim.sh mcp --transport streamable-http --host 0.0.0.0 --port 8000
    ports:
      - "8005:8000"
    networks:
      - open-terminal-mcp-net
    logging:
      driver: loki
      options:
        loki-url: "http://192.168.1.171:3100/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  open-terminal-mcp-net:
    driver: overlay
    attachable: true

configs:
  homelab-ca-bundle-v1:
    external: true

secrets:
  open-terminal-mcp-infisical-client-id-v1:
    external: true
  open-terminal-mcp-infisical-client-secret-v1:
    external: true
  open-terminal-mcp-infisical-project-id-v1:
    external: true

volumes:
  open-terminal-mcp-home:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.1.180,rw,vers=3"
      device: ":/volume1/nfs-data/open-terminal-mcp/home"
