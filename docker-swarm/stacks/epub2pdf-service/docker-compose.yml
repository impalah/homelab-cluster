# Fase 4 (docs/31-docker-swarm.md): epub2pdf-service migrado al swarm.
#
# `constraints: node.hostname==retaco` RETIRADO (2026-08-31, decisión
# explícita del usuario) -- ya no es cierto que solo `retaco` tenga el
# montaje NFS del NAS (`ketekasko:/volume1/nfs-data` en `/mnt/nfs-data`):
# se montó en los 5 managers del Swarm el mismo día (a petición del
# usuario, NAS protegido con SAI y considerado infraestructura esencial del
# clúster). El proceso corre como root (`uid=0`), así que la ACL propia de
# UGOS (ver `docs/21-configuracion-nas-ugreen.md`) no es problema. Sin
# migración de datos que hacer -- los volúmenes ya estaban en NFS de
# siempre, el pin solo existía por la disponibilidad del punto de montaje,
# no por los datos en sí. Sin secretos (nunca los tuvo, .env sin overrides
# -- valores por defecto tal cual estaban en Compose clásico).
version: "3.8"

services:
  epub2pdf-service:
    image: registry.404labo.net/epub2pdf-service:latest
    environment:
      EPUB2PDF_LOG_LEVEL: INFO
      EPUB2PDF_LOG_FORMAT: json
      EPUB2PDF_CONVERSION_TIMEOUT_SECONDS: "300"
    volumes:
      - /mnt/nfs-data/epub2pdf/input:/data/input:ro
      - /mnt/nfs-data/epub2pdf/output:/data/output
    ports:
      - "8003:8003"
    networks:
      - epub2pdf-net
    logging:
      driver: loki
      options:
        loki-url: "http://192.168.1.171:3100/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  epub2pdf-net:
    driver: overlay
    attachable: true
