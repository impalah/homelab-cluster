# =============================================================================
# default.conf — override del nginx propio del contenedor capataz-frontend
# (frontend/nginx/default.conf del repo de Capataz, horneado en la imagen).
# Bind-mount de solo lectura sobre /etc/nginx/conf.d/default.conf — ver
# pi-utils/docker-compose.yml, servicio capataz-frontend.
#
# Única diferencia real frente al original: /api/ reenvía a
# "https://capataz-api.404labo.net" — el hostname real que expone Traefik
# (ver docker-swarm/stacks/traefik/dynamic/routes.yml), el mismo patrón que
# usa el propio capataz-api para referenciar otros servicios del clúster
# (CAPATAZ_PORTAINER_URL, CAPATAZ_GRAFANA_URL...). Sobrevive sin cambios el
# día que capataz-api/capataz-frontend acaben en nodos Swarm distintos
# (routing mesh sobre el mismo hostname) — ver docs/28.
#
# Mejora 41 (2026-08-28): renombrado de capataz-api.home.arpa (pi-dns/nginx,
# decomisionado) a capataz-api.404labo.net (Traefik, cert real de Let's
# Encrypt) — Traefik multiplexa varios hostnames por el mismo puerto 443 vía
# SNI exactamente igual que hacía nginx, así que los tres detalles no obvios
# de abajo se mantienen sin cambios de fondo, solo el hostname:
#
#   1. "resolver 127.0.0.11 + variable" en vez de un proxy_pass estático:
#      evita que este contenedor se niegue a arrancar si la resolución DNS
#      de capataz-api.404labo.net falla en el instante exacto del arranque.
#   2. "proxy_ssl_server_name on": nginx NO manda SNI en conexiones
#      proxy_pass https:// salientes por defecto. Sin esto, Traefik no sabe
#      qué certificado ni qué router servir y cae al comportamiento por
#      defecto — mismo riesgo que ya se vio en real con nginx/pi-dns.
#   3. "proxy_set_header Host capataz-api.404labo.net" (fijo, NO $host):
#      Traefik enruta por regla `Host(...)` -- si se propagase el Host
#      original de la petición del navegador (index.404labo.net/
#      home.404labo.net), no coincidiría con ningún router y la petición
#      fallaría pese a tener el SNI bien.
# =============================================================================
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  resolver 127.0.0.11 valid=30s;
  set $capataz_api_backend capataz-api.404labo.net;

  location /api/ {
    proxy_ssl_server_name on;
    proxy_pass https://$capataz_api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host capataz-api.404labo.net;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection '';
    proxy_buffering off;
  }
  # Renderizado en cada arranque por /docker-entrypoint.d/40-render-runtime-config.sh
  # (envsubst), en un tmpfs separado del bundle estático de solo lectura —
  # ver docs/adr/007-runtime-frontend-config.en.md del repo de Capataz.
  location = /config.js { alias /config-runtime/config.js; add_header Cache-Control "no-store" always; }
  location / { try_files $uri $uri/ /index.html; }
}
