# Fase 1 (docs/31-docker-swarm.md): node-exporter + cadvisor como servicio
# `mode: global` — sustituye las copias sueltas de cada docker-compose.yml de
# nodo. promtail/portainer-agent se quedan fuera de este stack a propósito
# (ver docs/31, tienen diferencias reales por nodo / requieren tocar el
# propio Portainer server) — se abordan en un paso posterior.
#
# `constraints: node.labels.common-stack==enabled` permite un cutover
# incremental nodo a nodo: solo aterriza en los nodos que ya tienen la
# etiqueta puesta (ver init/label-nodes.sh y el runbook), en vez de
# desplegarse de golpe en los 5 y chocar con los puertos de los contenedores
# antiguos que todavía no se han parado.
#
# Claves ignoradas por Swarm confirmadas en el PoC de la Fase 0
# (docs/31-docker-swarm.md): `pid`/`devices`/`privileged` no dan error pero
# se ignoran en silencio -- se dejan igualmente por documentar la intención
# original y por si una versión futura de Swarm las soporta. `cgroup: host`
# SÍ rompe el despliegue -- se ha quitado.
#
# Rutas de bind-mount uniformes en los 5 nodos (no `/srv/homelab/<nodo>/...`
# -- Swarm no soporta plantillas de nodo en rutas de host, ver docs/31):
# `/srv/homelab/node-exporter-textfile` en vez de la ruta específica de
# pi-obs (`/srv/homelab/pi-obs/node-exporter-textfile`, usada hoy por
# check-image-updates.sh) -- en pi-obs se deja como symlink al directorio
# real para no tocar ese script; en el resto de nodos es un directorio vacío
# nuevo (colector sin datos todavía, pero ya preparado para la mejora 36).
#
# ⚠️ BUG REAL encontrado y corregido (2026-09-01, verificando la mejora 36 en
# vivo): los `ports:` de abajo estaban en sintaxis corta ("9100:9100" /
# "8081:8080"), que en Swarm publica en `mode: ingress` POR DEFECTO -- una
# petición a `<ip-de-un-nodo>:9100` puede reenviarla la malla de rutado a
# node-exporter de OTRO nodo cualquiera de los 5, no necesariamente al de esa
# IP. Confirmado de forma inequívoca comparando, vía `docker exec` (sin red
# de por medio), el valor real de `node_apt_security_updates_pending` en
# `pi-utils` (0) contra lo que Prometheus veía etiquetado como
# `node="pi-utils"` (21, que en realidad era el valor real de `retaco`).
# Afecta potencialmente a la atribución de nodo de TODAS las métricas de
# node-exporter/cadvisor en estos 5 nodos desde la migración a Swarm, no
# solo a la mejora 36 -- pasó desapercibido hasta ahora porque la mayoría de
# métricas ya vigiladas (undervoltage, tamaños de disco) coinciden a menudo
# entre nodos por casualidad, y una métrica con valores realmente distintos
# por nodo lo hizo evidente. Corregido a `mode: host` (publica el puerto
# directamente en la interfaz de red de CADA nodo, sin pasar por la malla)
# -- el patrón oficialmente recomendado por Prometheus para node-exporter en
# Swarm. Sin downside identificado: `pi-obs/config/prometheus.yml` ya
# apunta a la IP fija de cada nodo, nunca dependió de la malla a propósito.
version: "3.8"

services:
  node-exporter:
    image: prom/node-exporter:v1.8.0
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.textfile.directory=/host/textfile"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /srv/homelab/node-exporter-textfile:/host/textfile:ro
    ports:
      - target: 9100
        published: 9100
        mode: host
    networks:
      - common-net
    pid: host
    deploy:
      mode: global
      placement:
        constraints:
          - node.labels.common-stack == enabled
      restart_policy:
        condition: on-failure

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    command:
      - "-disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp,disk,diskIO"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - target: 8080
        published: 8081
        mode: host
    networks:
      - common-net
    privileged: true
    devices:
      - /dev/kmsg
    deploy:
      mode: global
      placement:
        constraints:
          - node.labels.common-stack == enabled
      restart_policy:
        condition: on-failure

networks:
  common-net:
    driver: overlay
    attachable: true
