# Fase 4 (docs/31-docker-swarm.md): open-webui, en Swarm.
#
# `constraints: node.hostname==retaco` RETIRADO (2026-08-31, decisión
# explícita del usuario). Investigado antes de tocar nada: de los 890M de
# `/app/backend/data`, 889M eran `cache/embedding/models` -- un modelo de
# HuggingFace (`sentence-transformers/all-MiniLM-L6-v2`) descargado,
# 100% regenerable. El resto (`webui.db`+`-wal`/`-shm`, `vector_db`,
# `uploads` -- 1,1M en total) llevaba sin tocarse desde julio/principios de
# agosto -- coincide con lo ya anotado en la mejora 43 ("Postgres desde la
# migración, este directorio ya es solo residual"). La BD real
# (chat/usuarios) vive en postgres-main desde antes -- llega vía secreto de
# Infisical, no aparece en este fichero.
#
# Solución mixta (a petición del usuario, dado que el proceso corre como
# root -- uid=0 -- así que la ACL de UGOS no es problema aquí):
# - Lo residual (`webui.db*`, `vector_db`, `uploads`) migrado con `rsync`
#   (verificado por `md5sum`, sin pérdida) a `/mnt/nfs-data/open-webui/data`
#   (NAS ketekasko), montado en `/app/backend/data`.
# - `cache/` se superpone con un `tmpfs` propio DENTRO de esa misma ruta --
#   no persiste entre reinicios/nodos a propósito (es caché por
#   definición), evita ocupar el NAS con 889M de contenido regenerable.
#   Coste real: si el nodo cambia o reinicia, el modelo se vuelve a
#   descargar una vez (latencia de arranque en frío, no de cada request).
#
# `QDRANT_URI` -- `qdrant.404labo.net`, no IP hardcodeada (2026-08-31,
# limpieza a petición del usuario) -- Qdrant publica su puerto en
# `mode: ingress` (por defecto), así que la petición llega igual por la
# routing mesh aunque el DNS resuelva a otro nodo que el que ejecuta la
# tarea de verdad -- mismo mecanismo que ya usan `sonarqube.404labo.net`/
# `portainer.404labo.net`.
#
# Mejora 47 (2026-09-03): el bind-mount de /app/backend/data pasa a volumen
# Docker `driver: local` + `driver_opts: type: nfs` -- mismo dato real en
# el NAS (incluidos los `webui.db*`/`vector_db` residuales de arriba, sin
# tocar), mismo mecanismo que el resto de esta pasada. El `tmpfs` de
# `cache/` superpuesto DENTRO de esa misma ruta se mantiene exactamente
# igual -- Docker monta ambos por separado y el tmpfs sigue tapando el
# volumen NFS en ese subdirectorio concreto, sin ningún cambio de
# comportamiento. `vers=3` obligatorio.
version: "3.8"

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    environment:
      ENABLE_OLLAMA_API: "false"
      # Mejora 41 (2026-08-28): bifrost.404labo.net usa cert real de Let's
      # Encrypt -- certifi (Python) ya lo valida sin más. El binario CLI de
      # Infisical (Go), en cambio, SIGUE necesitando SSL_CERT_FILE explícito
      # (hallazgo real, ver apikey-service) -- se mantiene el combinado con
      # certifi en el entrypoint solo por si acaso alguna librería Python
      # mira SSL_CERT_FILE en vez de su propio bundle, ya no hace falta
      # añadir la CA interna al combinado (era eso lo único que sobra).
      OPENAI_API_BASE_URLS: https://bifrost.404labo.net/v1
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant.404labo.net:6333
      INFISICAL_DOMAIN: https://infisical.404labo.net/api
    volumes:
      - open-webui-data:/app/backend/data
      - type: tmpfs
        target: /app/backend/data/cache
        tmpfs:
          size: 1073741824
      - /srv/homelab/infisical/infisical-cli/infisical:/usr/local/bin/infisical:ro
    configs:
      # homelab-ca-bundle-v1: compartido con 10 stacks más (2026-08-31,
      # confirmado por md5sum idéntico) -- ver docker-swarm/stacks/authentik/
      # docker-compose.yml para la explicación completa. El entrypoint de
      # abajo sigue leyendo /etc/ssl/certs/homelab-ca.crt tal cual -- `cat`
      # no distingue si el origen es un bind-mount o un config.
      - source: homelab-ca-bundle-v1
        target: /etc/ssl/certs/homelab-ca.crt
    secrets:
      - source: open-webui-infisical-client-id-v1
        target: open-webui-infisical-client-id
      - source: open-webui-infisical-client-secret-v1
        target: open-webui-infisical-client-secret
      - source: open-webui-infisical-project-id-v1
        target: open-webui-infisical-project-id
    entrypoint: ["sh", "-c"]
    command:
      - |
        CERTIFI_BUNDLE=$$(python3 -c "import certifi; print(certifi.where())") &&
        cat "$$CERTIFI_BUNDLE" /etc/ssl/certs/homelab-ca.crt > /tmp/combined-ca.pem &&
        export SSL_CERT_FILE=/tmp/combined-ca.pem &&
        CLIENT_ID=$$(cat /run/secrets/open-webui-infisical-client-id) &&
        CLIENT_SECRET=$$(cat /run/secrets/open-webui-infisical-client-secret) &&
        PROJECT_ID=$$(cat /run/secrets/open-webui-infisical-project-id) &&
        TOKEN=$$(infisical login --method=universal-auth \
          --client-id="$$CLIENT_ID" \
          --client-secret="$$CLIENT_SECRET" \
          --plain --silent) &&
        exec infisical run --token="$$TOKEN" --projectId="$$PROJECT_ID" --env=prod --path=/open-webui/ -- \
          bash start.sh
    ports:
      # Publicado en 19002, no 8080 (2026-08-31) -- liberaba el 8080 para
      # poder quitarle el pin/mode:host a `bifrost` (mismo motivo, era el
      # otro extremo de esa colisión). `target: 8080` no cambia -- es el
      # puerto interno por defecto de open-webui, solo se remapea el lado
      # publicado. `mode: ingress` -- ya no hay `constraints` de nodo (ver
      # cabecera), la tarea puede aterrizar en cualquiera de los 5 managers.
      - target: 8080
        published: 19002
        mode: ingress
    networks:
      - open-webui-net
    logging:
      driver: loki
      options:
        loki-url: "http://192.168.1.171:3100/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  open-webui-net:
    driver: overlay
    attachable: true

configs:
  homelab-ca-bundle-v1:
    external: true

secrets:
  open-webui-infisical-client-id-v1:
    external: true
  open-webui-infisical-client-secret-v1:
    external: true
  open-webui-infisical-project-id-v1:
    external: true

volumes:
  open-webui-data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.1.180,rw,vers=3"
      device: ":/volume1/nfs-data/open-webui/data"
