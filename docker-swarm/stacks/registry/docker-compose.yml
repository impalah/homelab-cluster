# Fase 4 (docs/31-docker-swarm.md): primer servicio CON ESTADO migrado al
# swarm -- elegido por ser el de menor riesgo (imágenes reconstruibles desde
# services/<nombre>/ o el repo externo de cada una, no es una pérdida de
# datos irrecuperable como postgres-main/vaultwarden).
#
# `constraints: node.hostname==retaco` RETIRADO (2026-08-31, decisión
# explícita del usuario). A diferencia de postgres-main/qdrant, el registry
# es un almacén de blobs por hash de contenido (write-once, sin base de
# datos embebida con WAL/mmap) -- patrón compatible con NFS sin el mismo
# riesgo de escritura frecuente. Corre como root (`uid=0`), sin problema de
# ACL. `data/` (32G) y `auth/htpasswd` migrados con el servicio parado
# (`docker service scale ...=0`, sin subidas en curso confirmado antes de
# parar) a `/mnt/nfs-data/registry/{data,auth}`.
#
# Mismo puerto publicado (5000) que la copia Compose clásica que sustituye,
# así que docker-swarm/stacks/traefik/dynamic/routes.yml NO necesita
# cambios -- sigue apuntando a 192.168.1.174:5000, y como el puerto se
# publica en `mode: ingress` (por defecto), la routing mesh reenvía
# correctamente aunque el registry ya no esté físicamente en `retaco`
# (mismo mecanismo ya confirmado con `valkey`).
#
# REGISTRY_HTTP_SECRET como `docker secret` en vez de variable de entorno --
# mismo motivo que apikey-service (docker-swarm/stacks/apikey-service/):
# `docker service inspect` expone las env vars en texto plano a cualquiera
# con acceso al swarm, los secrets se montan como fichero. El htpasswd
# sigue siendo un bind-mount de fichero real (ya lo era en Compose clásico,
# no es un secreto rotable vía Infisical hoy).
version: "3.8"

services:
  registry:
    image: registry:2.8.3
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Homelab Cluster Registry"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        export REGISTRY_HTTP_SECRET=$$(cat /run/secrets/registry-http-secret)
        exec registry serve /etc/docker/registry/config.yml
    secrets:
      - source: registry-http-secret-v1
        target: registry-http-secret
    volumes:
      - /mnt/nfs-data/registry/data:/var/lib/registry
      - /mnt/nfs-data/registry/auth:/auth:ro
    ports:
      - "5000:5000"
    networks:
      - registry-net
    logging:
      driver: loki
      options:
        loki-url: "http://192.168.1.171:3100/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  registry-net:
    driver: overlay
    attachable: true

secrets:
  registry-http-secret-v1:
    external: true
