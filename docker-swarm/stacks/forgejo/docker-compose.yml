# Mejora 7 (docs/22-mejoras-futuras.md): Forgejo autoalojado, GitHub como
# espejo. Primera ronda de implementación (2026-09-03) -- SOLO instalación
# núcleo (web + git HTTPS/SSH), decidida explícitamente "poco a poco" con el
# usuario. La migración de repos (7.2) y Forgejo Actions/CI (7.3) quedan
# para rondas posteriores, sin tocar aquí.
#
# Nace directamente como stack Swarm -- sin legado Compose que migrar (a
# diferencia de la mayoría de servicios con estado de la Fase 4,
# docs/31-docker-swarm.md). Se aplica ya el patrón consolidado en la
# mejora 47: volumen Docker `driver: local` + `driver_opts: type: nfs`
# desde el primer despliegue, sin bind-mount transitorio -- el dato en sí
# es portable entre nodos (`vers=3` obligatorio, NFSv4 roto en este NAS,
# ver docs/21-configuracion-nas-ugreen.md); el `constraints` de más abajo
# no es por el dato, es por el puerto SSH en `mode: host` (ver más abajo).
#
# Imagen ROOTLESS (`codeberg.org/forgejo/forgejo:16.0.3-rootless`), no la
# variante root -- uid/gid 1000 fijo de fábrica, coherente con el resto del
# clúster (n8n/SonarQube ya corren como 1000, ver CLAUDE.md "Bind-mount
# ownership"). Directorio de datos real de esta imagen: `/var/lib/gitea`
# (no `/data`, eso es solo la variante root) -- ahí monta el volumen NFS.
# Directorio preparado a mano antes del primer despliegue:
# `sudo mkdir -p /mnt/nfs-data/forgejo/data && sudo chown -R 1000:1000
# /mnt/nfs-data/forgejo` en un manager con /mnt/nfs-data montado (retaco) --
# un mkdir simple hereda la ACL propia de UGOS del directorio padre
# correctamente (docs/21), pero como con cualquier otro directorio nuevo en
# el NAS, root (vía sudo) es quien tiene que crearlo/chown-earlo la primera
# vez.
#
# Base de datos: Postgres en postgres-main (retaco), rol aislado propio
# (`create-postgres-db.sh postgres-main dbadmin forgejo forgejo`), mismo
# patrón que n8n/SonarQube/apikey-service -- NO SQLite embebido (habría sido
# el mismo tipo de riesgo, escritura real y frecuente, que la mejora 47
# decidió evitar para bases de datos activas, a diferencia del SQLite
# vestigial de n8n-aux/open-webui).
#
# SSH de Git en el puerto 2222 -- publicado DIRECTO, sin pasar por Traefik
# (SSH no es HTTP, Traefik necesitaría un entrypoint TCP dedicado que no
# existe hoy). La imagen rootless ya escucha SSH en 2222 por defecto (no
# puede bindear el 22 privilegiado sin root) -- se fija explícito de todos
# modos para no depender de un valor por defecto no versionado aquí.
#
# ⚠️ `mode: ingress` (el original, hasta 2026-10-02) rompía la red overlay
# `traefik-public` de este MISMO contenedor -- bug real de Swarm, reproducido
# en 3 nodos distintos (retaco/pinchi/miugarita) durante la migración fuera
# de las Raspberry Pi (docs/31-docker-swarm.md): el contenedor respondía
# perfectamente en local (`wget 127.0.0.1:3000` sano, healthcheck en verde),
# pero NINGÚN nodo podía alcanzar su IP de la red `traefik-public` desde
# fuera -- ni Traefik, ni un contenedor de prueba en la misma red, en
# ningún nodo probado. Quitar el puerto `ingress` (`--publish-rm`) restauró
# la conectividad al instante, confirmando que la combinación "puerto
# publicado en modo ingress + red overlay atachable en el mismo contenedor"
# es la causa real, no la red en sí ni el nodo. Fix: `mode: host` (sin
# routing mesh, el puerto solo escucha en el nodo real) + `constraints`
# fijo -- por eso YA NO es "sin constraint de nodo" como el resto de este
# fichero narra más abajo; necesita una IP estable para el DNS de
# `FORGEJO__server__SSH_DOMAIN` (git-over-SSH no pasa por Traefik, no hay
# mesh que lo salve si cambia de nodo).
#
# ⚠️ CORRECCIÓN (2026-10-08): el diagnóstico de arriba era incompleto. El
# mismo síntoma reapareció en servicios SIN ningún puerto publicado (`ntfy`)
# y la causa real se vio directamente en `retaco`: su tabla de reenvío VXLAN
# de la red `traefik-public` (`bridge fdb show dev vxlan0` dentro de
# `/run/docker/netns/1-<id-red>`) tenía entradas obsoletas -- IPs reutilizadas
# por tareas nuevas seguían apuntando al nodo de la tarea anterior, y dockerd
# no las sustituía ("neighbor entry already exists"). Que quitar el puerto
# "arreglara" forgejo fue casualidad: recrear la tarea le dio una IP sin
# entrada vieja. Ver docs/31-docker-swarm.md. `mode: host` + nodo fijo se
# mantiene igualmente -- sigue siendo válido para un puerto SSH que no pasa
# por Traefik, pero NO es la cura de aquel fallo.
#
# ⚠️ El nodo elegido es `retaco`, no `pinchi` (la convención habitual del
# resto de hostnames de servicio, ver README.md) -- a propósito: con un
# único manager real tras el incidente de Swarm (docs/31), Traefik vive
# solo en `retaco` (`constraints: node.role == manager`) y TODOS los
# hostnames `*.404labo.net` resuelven hoy a `192.168.10.7` en Pi-hole, no a
# `.8` -- fijar `forgejo` a `pinchi` habría dejado el git-over-SSH
# apuntando a un nodo distinto del que resuelve `forgejo.404labo.net`.
# Revisar esta decisión cuando se recuperen los 4 managers (trabajo
# pendiente aparte, ver docs/31) y la convención de `.8` vuelva a ser cierta.
#
# FORGEJO__database__PASSWD NO vive aquí -- se inyecta vía Infisical
# (path /forgejo/, secreto llamado literalmente `FORGEJO__database__PASSWD`,
# mismo mecanismo que N8N_ENCRYPTION_KEY en n8n-main) -- infisical run
# reexporta cada secreto como variable de entorno con su mismo nombre, así
# que el entrypoint nativo de Forgejo (que lee FORGEJO__* para generar
# app.ini en el primer arranque) lo recoge sin cambios.
#
# INSTALL_LOCK=true -- evita el asistente web de instalación (todo
# preconfigurado por variables de entorno), igual de necesario aquí que en
# cualquier servicio expuesto a internet vía Traefik.
#
# Entrypoint: se antepone el login de Infisical al entrypoint NATIVO de la
# imagen rootless (`/usr/local/bin/docker-entrypoint.sh`, que renderiza
# app.ini desde las FORGEJO__* y luego arranca `gitea web`) en vez de
# invocar el binario `gitea` directamente -- ese script hace el bootstrap
# real (environment-to-ini, permisos), saltárselo rompería el primer
# arranque.
version: "3.8"

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.3-rootless
    user: "1000:1000"
    environment:
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgresql.404labo.net:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__server__DOMAIN: forgejo.404labo.net
      FORGEJO__server__ROOT_URL: https://forgejo.404labo.net/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__SSH_DOMAIN: forgejo.404labo.net
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__server__SSH_LISTEN_PORT: "2222"
      FORGEJO__security__INSTALL_LOCK: "true"
      # Cola en memoria en vez de LevelDB (2026-10-14). Por defecto Forgejo usa
      # LevelDB en /var/lib/gitea/queues/common, y ese directorio vive en un
      # volumen NFS del NAS (ketekasko). Tras un corte de luz el NFS cayó y, al
      # volver, `queues/common/LOCK` daba "permission denied": Forgejo no
      # arrancaba y Swarm lo reiniciaba en bucle (~80 veces en 27 min, 2026-10-13).
      # LevelDB y sus ficheros LOCK no se llevan bien con NFS. Con `channel` las
      # tareas pendientes (correo, webhooks, indexación) no sobreviven a un
      # reinicio, algo asumible aquí; los repos y la base de datos no cambian.
      FORGEJO__queue__TYPE: channel
      # Mismo hallazgo que el resto del clúster -- el binario CLI de
      # Infisical (Go) no trae almacén de CAs del sistema, necesita
      # SSL_CERT_FILE explícito aunque infisical.404labo.net use cert real
      # de Let's Encrypt.
      INFISICAL_DOMAIN: https://infisical.404labo.net/api
      SSL_CERT_FILE: /etc/ssl/certs/homelab-ca.crt
    volumes:
      - forgejo-data:/var/lib/gitea
      - /srv/homelab/infisical/infisical-cli/infisical:/usr/local/bin/infisical:ro
    configs:
      # homelab-ca-bundle-v1: compartido con el resto de stacks del
      # clúster -- ver docker-swarm/stacks/authentik/docker-compose.yml
      # para la explicación completa.
      - source: homelab-ca-bundle-v1
        target: /etc/ssl/certs/homelab-ca.crt
    secrets:
      - source: forgejo-infisical-client-id-v2
        target: forgejo-infisical-client-id
      - source: forgejo-infisical-client-secret-v2
        target: forgejo-infisical-client-secret
      - source: forgejo-infisical-project-id-v2
        target: forgejo-infisical-project-id
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        CLIENT_ID=$$(cat /run/secrets/forgejo-infisical-client-id) &&
        CLIENT_SECRET=$$(cat /run/secrets/forgejo-infisical-client-secret) &&
        PROJECT_ID=$$(cat /run/secrets/forgejo-infisical-project-id) &&
        TOKEN=$$(infisical login --method=universal-auth \
          --client-id="$$CLIENT_ID" \
          --client-secret="$$CLIENT_SECRET" \
          --plain --silent) &&
        exec infisical run --token="$$TOKEN" --projectId="$$PROJECT_ID" --env=prod --path=/forgejo/ -- \
          /usr/local/bin/docker-entrypoint.sh
    healthcheck:
      # /api/healthz -- endpoint estándar de Forgejo/Gitea, sin auth.
      # OJO: el JSON real lleva espacio tras los dos puntos ("status": "pass",
      # no "status":"pass") -- un primer intento sin el espacio hizo que el
      # healthcheck fallara siempre pese a que /api/healthz respondía bien
      # (confirmado en vivo, 2026-09-03), y Swarm mataba/reprogramaba la
      # tarea cada ~2-3 min (start_period + reintentos) creyéndola no sana.
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://127.0.0.1:3000/api/healthz | grep -q '\"status\": \"pass\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Generoso -- primer arranque incluye migraciones de esquema contra
      # Postgres, no solo el arranque normal del binario.
      start_period: 90s
    ports:
      - target: 2222
        published: 2222
        mode: host
    networks:
      - forgejo-net
      - traefik-public
    logging:
      driver: loki
      options:
        loki-url: "http://observability.404labo.net:3100/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==retaco
      # `any` y no `on-failure` (2026-10-15, docs/31-docker-swarm.md): con on-failure
      # una salida con código 0 (p. ej. un cierre limpio por SIGTERM tras fallar un
      # healthcheck) NO se reprograma y el servicio se queda en 0/1 sin aviso.
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.forgejo-404labo-net.rule=Host(`forgejo.404labo.net`)"
        - "traefik.http.routers.forgejo-404labo-net.entrypoints=websecure"
        - "traefik.http.routers.forgejo-404labo-net.tls=true"
        - "traefik.http.routers.forgejo-404labo-net.service=forgejo"
        - "traefik.http.services.forgejo.loadbalancer.server.port=3000"

networks:
  forgejo-net:
    driver: overlay
    attachable: true
  traefik-public:
    external: true
    name: traefik_traefik-public

configs:
  homelab-ca-bundle-v1:
    external: true

secrets:
  # -v2 (2026-10-01): Infisical se reconstruyó desde cero tras el incidente
  # de la IP de advertise del manager del Swarm (docs/31) -- Machine Identity
  # nueva, mismos nombres de secret pero valores distintos.
  forgejo-infisical-client-id-v2:
    external: true
  forgejo-infisical-client-secret-v2:
    external: true
  forgejo-infisical-project-id-v2:
    external: true

volumes:
  forgejo-data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.10.6,rw,vers=3"
      device: ":/volume1/nfs-data/forgejo/data"
