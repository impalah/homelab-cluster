# Fase 4 (docs/31-docker-swarm.md): sexto servicio con estado migrado al
# swarm -- el más sensible en cuanto a pérdida de datos de todo el clúster
# (gestor de contraseñas). SQLite local, autocontenido, sin dependencias
# cruzadas con otros servicios del nodo (confirmado por grep antes de
# migrar, igual que n8n-aux).
#
# `constraints: node.hostname==pi-utils` → `node.hostname==pinchi`
# (2026-08-31, decisión explícita del usuario, mismo motivo que
# `portainer-server`/intento de `sonarqube`: `db.sqlite3`+`-wal`+`-shm`
# (escritura activa) y `rsa_key.pem` (clave privada real de sesión) son
# estado genuino y sensible -- se prefiere el NVMe de `pinchi` a NFS para
# esto, a diferencia de `n8n-aux` (mismo tipo de riesgo, pero sin clave
# privada de por medio, ahí se aceptó NFS). `icon_cache/` (favicons
# cacheados, cosmético, cero riesgo) viaja igual, sin separarlo -- no
# compensa la complejidad de un montaje mixto para algo tan pequeño (448K
# en total).
#
# Migración hecha con el servicio parado (`docker service scale ...=0`,
# evita copiar el SQLite/WAL a mitad de escritura) + `tar` en pipe directo
# nodo a nodo (sin disco intermedio, hay una clave privada de por medio) +
# verificación por `md5sum` de `db.sqlite3` y `rsa_key.pem`. Backup
# adicional tomado en `pi-utils` antes de mover nada
# (`vaultwarden-backup-<fecha>.tar.gz`, no borrado) -- además del backup ya
# ejecutado en su día con `shared/scripts/backup-vaultwarden.sh` al migrar
# a Swarm por primera vez (ver `docs/31-docker-swarm.md`).
version: "3.8"

services:
  vaultwarden:
    image: vaultwarden/server:1.37.0
    environment:
      # Mejora 41 (2026-08-28): backup previo (vaultwarden_20260827-2222.tar.gz)
      # + auditada la tabla `twofactor` -- CERO credenciales WebAuthn/2FA
      # registradas hoy, sin riesgo real de invalidar un passkey existente.
      DOMAIN: https://vaultwarden.404labo.net
      SIGNUPS_ALLOWED: "false"
      WEBSOCKET_ENABLED: "true"
      LOG_LEVEL: warn
      # SSL_CERT_FILE hace falta -- esta imagen no trae un almacén de CAs del
      # sistema (hallazgo real, ver apikey-service). homelab-ca.crt es un
      # bundle combinado (CA interna + almacén público estándar).
      INFISICAL_DOMAIN: https://infisical.404labo.net/api
      SSL_CERT_FILE: /etc/ssl/certs/homelab-ca.crt
    volumes:
      - /srv/homelab/pinchi/vaultwarden/data:/data
      - /srv/homelab/infisical/infisical-cli/infisical:/usr/local/bin/infisical:ro
    configs:
      # homelab-ca-bundle-v1: compartido con 10 stacks más (2026-08-31,
      # confirmado por md5sum idéntico) -- ver docker-swarm/stacks/authentik/
      # docker-compose.yml para la explicación completa.
      - source: homelab-ca-bundle-v1
        target: /etc/ssl/certs/homelab-ca.crt
    secrets:
      - source: vaultwarden-infisical-client-id-v1
        target: vaultwarden-infisical-client-id
      - source: vaultwarden-infisical-client-secret-v1
        target: vaultwarden-infisical-client-secret
      - source: vaultwarden-infisical-project-id-v1
        target: vaultwarden-infisical-project-id
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        CLIENT_ID=$$(cat /run/secrets/vaultwarden-infisical-client-id) &&
        CLIENT_SECRET=$$(cat /run/secrets/vaultwarden-infisical-client-secret) &&
        PROJECT_ID=$$(cat /run/secrets/vaultwarden-infisical-project-id) &&
        TOKEN=$$(infisical login --method=universal-auth \
          --client-id="$$CLIENT_ID" \
          --client-secret="$$CLIENT_SECRET" \
          --plain --silent) &&
        exec infisical run --token="$$TOKEN" --projectId="$$PROJECT_ID" --env=prod --path=/vaultwarden/ -- \
          /start.sh
    ports:
      - "8222:80"
    networks:
      - vaultwarden-net
    logging:
      driver: loki
      options:
        loki-url: "http://192.168.1.171:3100/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==pinchi
      restart_policy:
        condition: on-failure

networks:
  vaultwarden-net:
    driver: overlay
    attachable: true

configs:
  homelab-ca-bundle-v1:
    external: true

secrets:
  vaultwarden-infisical-client-id-v1:
    external: true
  vaultwarden-infisical-client-secret-v1:
    external: true
  vaultwarden-infisical-project-id-v1:
    external: true
