      entryPoints: ["websecure"]
      tls: {}
      service: n8n-aux
    portainer-404labo-net:
      rule: "Host(`portainer.404labo.net`)"
      entryPoints: ["websecure"]
      tls: {}
      service: portainer
    vaultwarden-404labo-net:
      rule: "Host(`vaultwarden.404labo.net`)"
      entryPoints: ["websecure"]
      tls: {}
      service: vaultwarden

  services:
    index:
      loadBalancer:
        servers:
          # 192.168.1.174 (retaco), no .173 (pi-utils) -- constraint de nodo
          # liberado en la mejora 43 (2026-08-31, ver
          # docker-swarm/stacks/capataz/docker-compose.yml), pero esta URL se
          # quedó apuntando a pi-utils sin actualizar; detectado al caerse
