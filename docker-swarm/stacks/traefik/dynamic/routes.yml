# Fase 3b (docs/31-docker-swarm.md): configuración dinámica de Traefik vía
# `providers.file` -- necesaria porque la mayoría de backends reales
# (retaco/ryzen/pi-obs/pi-sonar/pi-utils, servicios con IP:puerto fija) NO
# son todavía servicios de Swarm y por tanto no los descubre el proveedor
# `swarm` por labels (ese mecanismo solo aplica a markitdown-service por
# ahora, fase 2). Aquí se replica, servicio a servicio, cada bloque server{}
# de pi-dns/config/nginx/nginx.conf que NO exige auth_request/forward-auth --
# ver docs/31-docker-swarm.md fase 3b para la lista de hostnames pendientes
# (apikey-service y Authentik forward-auth) y el motivo de dejarlos fuera de
# este primer incremento.
#
# Deliberadamente fuera de este fichero (ver docs/31-docker-swarm.md):
#   - old.index.404labo.net (sirve estático directamente, Traefik no tiene un
#     backend de fichero-servidor propio -- necesitaría un contenedor nginx
#     aparte solo para esto, no vale la pena todavía)
#   - apikey.404labo.net / pihole.404labo.net (apikey-service y pihole solo
#     escuchan en la red Docker interna de pi-dns, sin puerto publicado al
#     LAN -- no alcanzables desde Traefik en ningún otro nodo tal cual hoy)
#   - markitdown.404labo.net (hostname real) -- se añade como label en el
#     propio stack de markitdown-service (proveedor `swarm`, no `file`),
#     igual que markitdown-test.local en la fase 3a, para no declarar el
#     mismo servicio en dos proveedores a la vez.
#
# Segundo incremento de 3b (2026-08-25): los 8 hostnames protegidos con
# apikey-service + prometheus.404labo.net (Authentik) -- decisión del usuario:
# adelantar la migración de apikey-service al swarm (docker-swarm/stacks/
# apikey-service/) para que sea alcanzable desde Traefik en cualquier nodo,
# y resolver el forward-auth de Authentik en el mismo incremento. Traefik no
# tiene `auth_request` -- el equivalente nativo es el middleware
# `forwardAuth`, que llama a una URL externa por cada petición y deniega si
# no responde 2xx.
#
# Tercer incremento de 3b (2026-08-26): home.404labo.net/capataz-api.
# 404labo.net -- certificado real de Let's Encrypt (dominio público, no la
# CA interna), emitido y renovado por shared/scripts/renew-letsencrypt.sh
# (cron en pi-dns, reto DNS-01 vía plugin dns_aws de acme.sh contra la
# hosted zone Route53 de 404labo.net -- mejora 32 de docs/22-mejoras-
# futuras.md). Mismos backends ya declarados para index/capataz-api
# (404labo.net) -- se reutiliza el mismo `service:`, solo cambia el router
# (Host + certificado). El renovador NO actualiza este secret de Swarm
# automáticamente todavía (es inmutable, hace falta versión nueva +
# redeploy) -- ver docs/31-docker-swarm.md para el procedimiento manual
# pendiente de automatizar.
#
# Fase A de la mejora 41 (2026-08-28, docs/22-mejoras-futuras.md): se añade
# un router gemelo bajo *.404labo.net para CADA hostname que aún vive solo
# en *.404labo.net -- mismo patrón mecánico que el tercer incremento de 3b de
# arriba (mismo `service:`, `tls: {}` deja que Traefik elija el certificado
# wildcard ya cargado por SNI, sin config adicional). Paso puramente
# aditivo: ambos dominios responden en paralelo, nada se retira todavía.
# `index`/`capataz-api` ya tenían su gemelo (`home-404labo-net`/
# `capataz-api-404labo-net`, arriba) -- no se duplica. El router
# `prometheus-404labo-net` queda añadido pero el login de Authentik no
# funcionará de punta a punta hasta que se actualice el "External Host" del
# Proxy Provider en la UI de Authentik (Fase C) -- añadir el router no es
# lo mismo que completar el corte de ese hostname.
#
# Cierre de la mejora 41 (2026-08-28): retirados todos los routers
# `Host(*.404labo.net)` (~24, listados arriba en los incrementos previos) y el
# certificado de *.404labo.net -- verificados sanos todos sus gemelos
# *.404labo.net primero (incluida la Fase C de Authentik), aplicado el corte
# de DNS en Pi-hole (shared/dns/dns-records.md) y decomisionado nginx en
# pi-dns en el mismo cierre. Los routers `-404labo-net` que quedan abajo son
# ahora los únicos que existen para cada hostname -- se conserva el sufijo
# en su nombre (cosmético, sin efecto funcional) para no tocar 24 bloques
# solo por estética.
#
# Migración al router Cudy R700 (2026-09-28, ver el historial de esta sesión
# y mejora 50/53 de docs/22-mejoras-futuras.md): todas las IPs de backend de
# este fichero seguían apuntando al esquema antiguo 192.168.1.17x/.150 pese a
# que el resto del repo (docker-compose.yml de cada stack, load-dns-
# records.sh, setup-swarm-firewall.sh) ya se había actualizado al nuevo
# 192.168.10.x -- este fichero se quedó fuera de aquella pasada porque vive
# bajo dynamic/ y no se detectó hasta que provocó un 502 real en
# registry.404labo.net. Corregido ahora: retaco 192.168.10.7, ryzen/mole
# 192.168.10.10, pi-obs 192.168.10.4, pi-sonar 192.168.10.5, pinchi
# 192.168.10.8. Las notas de comentario que mencionan IPs .173/.175 antiguas
# más abajo son narrativa histórica de decisiones de colocación de nodo, no
# configuración viva -- se dejan tal cual, mismo criterio que el resto del
# repo con 404labo.net.

tls:
  certificates:
    - certFile: /run/secrets/404labo-net.crt
      keyFile: /run/secrets/404labo-net.key

http:
  middlewares:
    # apikey-service ahora vive también en el swarm (docker-swarm/stacks/
    # apikey-service/), en la misma red overlay `traefik-public` que
    # Traefik -- se le llama por nombre de servicio de Swarm
    # (`apikey-service`, puerto interno 8090), sin pasar por el puerto
    # publicado 8091 ni por IP fija. Verificado en vivo: `docker exec` en un
    # contenedor de Traefik resuelve y alcanza `http://apikey-service:8090/
    # health` correctamente.
    #
    # `authRequestHeaders` limita lo que se reenvía al backend de auth a
    # solo X-Api-Key -- mismo criterio de mínima exposición que el
    # `proxy_set_header` explícito de apikey-auth.conf en nginx (que
    # también limpia Content-Length y desactiva el body).
    apikey-auth:
      forwardAuth:
        address: "http://apikey-service:8090/validate"
        trustForwardHeader: true
        authRequestHeaders:
          - X-Api-Key
    # Authentik: mismo Proxy Provider (modo "Forward auth, single
    # application") ya usado por nginx para prometheus.404labo.net -- el
    # outpost embebido expone varios sub-endpoints por tipo de proxy
    # (/auth/nginx, /auth/traefik...) sobre el MISMO provider, no hace
    # falta crear uno nuevo en Authentik. Por nombre de servicio Swarm
    # (2026-09-29, ver docker-swarm/stacks/authentik/docker-compose.yml) en
    # vez de IP fija -- authentik-server está en la misma red overlay
    # `traefik-public` que Traefik, mismo patrón que apikey-service más
    # arriba. Antes era una IP fija que se rompía cada vez que Swarm
    # reprogramaba authentik-server a otro nodo (sin constraint).
    authentik-auth:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - Set-Cookie
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid

  routers:
    ollama-404labo-net:
      rule: "Host(`ollama.404labo.net`)"
      entryPoints: ["websecure"]
      tls: {}
      middlewares: ["apikey-auth"]
      service: ollama
    vllm-404labo-net:
      rule: "Host(`vllm.404labo.net`)"
      entryPoints: ["websecure"]
      tls: {}
      middlewares: ["apikey-auth"]
      service: vllm
    comfyui-404labo-net:
      rule: "Host(`comfyui.404labo.net`)"
      entryPoints: ["websecure"]
      tls: {}
      middlewares: ["apikey-auth"]
      service: comfyui
    epub2pdf-404labo-net:
      rule: "Host(`epub2pdf.404labo.net`)"
      entryPoints: ["websecure"]
      tls: {}
      middlewares: ["apikey-auth"]
      service: epub2pdf
    pdf2chunks-404labo-net:
      rule: "Host(`pdf2chunks.404labo.net`)"
      entryPoints: ["websecure"]
      tls: {}
      middlewares: ["apikey-auth"]
      service: pdf2chunks
    prometheus-404labo-net:
      rule: "Host(`prometheus.404labo.net`)"
      entryPoints: ["websecure"]
      tls: {}
      middlewares: ["authentik-auth"]
      service: prometheus
    qdrant-404labo-net:
      rule: "Host(`qdrant.404labo.net`)"
      entryPoints: ["websecure"]
      tls: {}
      service: qdrant
    infisical-404labo-net:
      rule: "Host(`infisical.404labo.net`)"
      entryPoints: ["websecure"]
      tls: {}
      service: infisical
    registry-404labo-net:
      rule: "Host(`registry.404labo.net`)"
      entryPoints: ["websecure"]
      tls: {}
      service: registry
    whisper-404labo-net:
      rule: "Host(`whisper.404labo.net`)"
      entryPoints: ["websecure"]
      tls: {}
      service: whisper
    grafana-404labo-net:
      rule: "Host(`grafana.404labo.net`)"
      entryPoints: ["websecure"]
      tls: {}
      service: grafana
    sonarqube-404labo-net:
      rule: "Host(`sonarqube.404labo.net`)"
      entryPoints: ["websecure"]
      tls: {}
      service: sonarqube
    portainer-404labo-net:
      rule: "Host(`portainer.404labo.net`)"
      entryPoints: ["websecure"]
      tls: {}
      service: portainer
    vaultwarden-404labo-net:
      rule: "Host(`vaultwarden.404labo.net`)"
      entryPoints: ["websecure"]
      tls: {}
      service: vaultwarden

  services:
    # Migrados del proveedor `file` (este bloque, IP:puerto fija) al
    # proveedor `swarm` (labels) el 2026-09-29: index/capataz-frontend,
    # capataz-api, openwebui, n8n, n8n-aux, bifrost, rsshub, open-terminal,
    # crawl4ai-scraper, authentik -- eran servicios sin constraint de nodo
    # (liberado en la mejora 43) que cambiaron de nodo varias veces en un
    # mismo incidente (migración al router Cudy R700 + recuperación del
    # Swarm), rompiendo sus hostnames con 502 cada vez que Swarm los
    # reprogramaba sin que este fichero se enterase. Con labels, Traefik
    # los descubre automáticamente sin importar el nodo -- ver el
    # `deploy.labels` de cada docker-compose.yml (mismo patrón que
    # markitdown-service, primer caso de esto en el repo). Sus routers y
    # entradas de `services:` ya no viven aquí (el middleware
    # `authentik-auth` de arriba tampoco usa ya IP fija, mismo motivo).
    #
    # ⚠️ `registry`, `epub2pdf` y `pdf2chunks` (más abajo) SIGUEN en este
    # fichero pese a tener el mismo problema de fondo (constraint de nodo
    # también liberado, ver cada docker-compose.yml) -- no se migraron en
    # esta pasada porque no llegaron a romperse en el incidente del
    # 2026-09-29 (se quedaron en retaco toda la tarde por suerte, no por
    # garantía). Candidatos claros para la misma migración si vuelven a
    # moverse -- comprobar primero con `docker service ps <servicio>
    # --filter desired-state=running` antes de asumir la IP de aquí.
    qdrant:
      loadBalancer:
        servers:
          - url: "http://192.168.10.7:6333"
    infisical:
      loadBalancer:
        servers:
          - url: "http://192.168.10.7:8006"
    registry:
      loadBalancer:
        servers:
          - url: "http://192.168.10.7:5000"
    whisper:
      loadBalancer:
        servers:
          - url: "http://192.168.10.10:9800"
    grafana:
      loadBalancer:
        servers:
          - url: "http://192.168.10.9:3000"
    sonarqube:
      loadBalancer:
        servers:
          # 19000, no 9000 (2026-08-31) -- puerto publicado cambiado en
          # docker-swarm/stacks/sonarqube/docker-compose.yml para liberar el
          # 9000 y poder quitarle el pin de nodo a authentik-server.
          # 192.168.10.9 (miugarita) desde 2026-10-08 -- sonarqube se movió
          # de pi-sonar a miugarita (retirada de las Raspberry Pi), sigue
          # pinnado a un nodo fijo, así que una IP fija aquí es correcta.
          - url: "http://192.168.10.9:19000"
    portainer:
      loadBalancer:
        servers:
          # 192.168.10.8 (pinchi), no .173 (pi-utils) -- servicio movido de
          # nodo (2026-08-31, fiabilidad de disco, ver docker-swarm/stacks/
          # portainer-server/docker-compose.yml). 19001, no 9000
          # (2026-08-31) -- puerto publicado cambiado, deja a
          # authentik-server como único usuario del 9000 en el clúster.
          - url: "http://192.168.10.8:19001"
    vaultwarden:
      loadBalancer:
        servers:
          # 192.168.10.8 (pinchi), no .173 (pi-utils) -- servicio movido
          # de nodo (2026-08-31, fiabilidad de disco/SQLite activo, ver
          # docker-swarm/stacks/vaultwarden/docker-compose.yml).
          - url: "http://192.168.10.8:8222"
    ollama:
      loadBalancer:
        servers:
          - url: "http://192.168.10.10:11434"
    vllm:
      loadBalancer:
        servers:
          - url: "http://192.168.10.10:8010"
    comfyui:
      loadBalancer:
        servers:
          - url: "http://192.168.10.10:8188"
    epub2pdf:
      loadBalancer:
        servers:
          - url: "http://192.168.10.7:8003"
    pdf2chunks:
      loadBalancer:
        servers:
          - url: "http://192.168.10.7:8004"
    prometheus:
      loadBalancer:
        servers:
          - url: "http://192.168.10.9:9090"
