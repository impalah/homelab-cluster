# Fase 4 (docs/31-docker-swarm.md): sonarqube, en Swarm.
#
# ⚠️ Intento de mover `constraints: node.hostname==pi-sonar` →
# `node.hostname==pinchi` REVERTIDO (2026-08-31, mismo día) -- el arranque
# en `pinchi` se quedó colgado indefinidamente en el paso `infisical run`
# (sin red: probado con éxito por `curl` directo a infisical.404labo.net y
# a app.infisical.com desde la misma red overlay; sin llegar siquiera a
# generar una petición en los logs del propio Infisical) -- causa real no
# diagnosticada, sin poder depurar más a fondo por bloqueo del clasificador
# de seguridad al necesitar pegar un token real en un comando de prueba.
# **Pendiente de revisión** -- ver mejora 43 en docs/22-mejoras-futuras.md,
# no reintentar sin investigar antes por qué falla justo aquí y no en
# `authentik`/`bifrost`/`open-webui`, que sí arrancaron en `pinchi` sin
# problema con el mismo mecanismo de Infisical.
#
# `data/` (índice de Elasticsearch, `es8`/`es9`) se queda en bind-mount +
# nodo fijo (`pi-sonar` de nuevo) -- deliberadamente NO se movió a NFS,
# misma categoría de riesgo que `postgres-main`/`qdrant` ya señalada en la
# mejora 43 (base de datos real con escritura frecuente, sin medir NFS
# antes de usarlo ahí).
#
# Lo que SÍ se mantiene de este intento (no depende de qué nodo aloje el
# servicio, verificado funcionando antes del cuelgue): `extensions/` --
# prácticamente vacío (`downloads/` sin contenido real) -- en NFS
# (`/mnt/nfs-data/sonarqube/extensions`); `logs/`/`temp/` -- ninguno de los
# dos aloja nada que deba sobrevivir a un reinicio -- en `tmpfs`; binario de
# `infisical` en la ruta compartida multi-arquitectura (ya no depende de
# `/srv/homelab/pi-sonar/infisical-cli/`); puerto en `mode: ingress` (sin
# colisión real, el pin no lo exige por sí solo).
#
# Ya usaba IP/alias DNS real para postgres-main (`postgresql.404labo.net`,
# no alias Docker) -- sin ajustes de red necesarios.
#
# ⚠️ Imagen fijada por DIGEST, no por el tag flotante "sonarqube:community"
# de la copia clásica -- incidente real (2026-08-27): el primer despliegue
# con el tag flotante resolvió una imagen 26.8.0 ya cacheada en el nodo
# (pull de 5 días antes, nunca aplicado porque nadie había recreado el
# contenedor clásico desde entonces) en vez de la que llevaba semanas
# corriendo de verdad -- SonarQube arrancó pidiendo DB_MIGRATION_NEEDED sin
# que nadie lo pidiera. Decisión del usuario: revertir al digest exacto de
# la imagen que corría antes de tocar nada, sin migrar. Actualizar de
# verdad queda como decisión aparte y deliberada, no de rebote -- mismo
# criterio ya aplicado a este servicio en Compose clásico (nunca
# auto-actualizar, ver docs/16-mantenimiento-actualizaciones.md).
#
# Mejora 47 (2026-09-03): SOLO `extensions/` pasa a volumen Docker
# `driver: local` + `driver_opts: type: nfs` -- `data/` (índice real de
# Elasticsearch) y el `constraints: node.hostname==pi-sonar` NO se tocan,
# siguen fuera de alcance por el mismo motivo de siempre (categoría de
# riesgo de postgres-main/qdrant, ver cabecera de este fichero). `vers=3`
# obligatorio.
version: "3.8"

services:
  sonarqube:
    image: sonarqube@sha256:160bd2f6a3485bd09b655ef22dd63c02bd1fa7ba82aa5d9973fd010b8bcca0b3
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgresql.404labo.net:5432/sonarqube
      SONAR_WEB_JAVAOPTS: -Xmx512m -Xms128m
      SONAR_CE_JAVAOPTS: -Xmx512m -Xms128m
      SONAR_SEARCH_JAVAOPTS: -Xmx1g -Xms1g -XX:MaxDirectMemorySize=256m
      SONAR_CORE_SERVERBASEURL: https://sonarqube.404labo.net
      # SSL_CERT_FILE hace falta solo para el binario CLI de Infisical (Go) --
      # esta imagen no trae un almacén de CAs de sistema utilizable por él
      # (hallazgo real, ver apikey-service); el propio JRE de SonarQube ya
      # trae su cacerts estándar, sin relación con esto.
      INFISICAL_DOMAIN: https://infisical.404labo.net/api
      SSL_CERT_FILE: /etc/ssl/certs/homelab-ca.crt
    volumes:
      - /srv/homelab/pi-sonar/sonarqube/data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - /srv/homelab/infisical/infisical-cli/infisical:/usr/local/bin/infisical:ro
      - type: tmpfs
        target: /opt/sonarqube/logs
        tmpfs:
          size: 67108864
      - type: tmpfs
        target: /opt/sonarqube/temp
        tmpfs:
          size: 536870912
    configs:
      # homelab-ca-bundle-v1: compartido con 10 stacks más (2026-08-31,
      # confirmado por md5sum idéntico) -- ver docker-swarm/stacks/authentik/
      # docker-compose.yml para la explicación completa.
      - source: homelab-ca-bundle-v1
        target: /etc/ssl/certs/homelab-ca.crt
    secrets:
      - source: sonarqube-infisical-client-id-v1
        target: sonarqube-infisical-client-id
      - source: sonarqube-infisical-client-secret-v1
        target: sonarqube-infisical-client-secret
      - source: sonarqube-infisical-project-id-v1
        target: sonarqube-infisical-project-id
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        CLIENT_ID=$$(cat /run/secrets/sonarqube-infisical-client-id) &&
        CLIENT_SECRET=$$(cat /run/secrets/sonarqube-infisical-client-secret) &&
        PROJECT_ID=$$(cat /run/secrets/sonarqube-infisical-project-id) &&
        TOKEN=$$(infisical login --method=universal-auth \
          --client-id="$$CLIENT_ID" \
          --client-secret="$$CLIENT_SECRET" \
          --plain --silent) &&
        exec infisical run --token="$$TOKEN" --projectId="$$PROJECT_ID" --env=prod --path=/sonarqube/ -- \
          /opt/sonarqube/docker/entrypoint.sh
    ports:
      # Publicado en 19000, no 9000 (2026-08-31) -- liberaba el 9000
      # (`authentik-server`/`portainer-server` lo compartían). `target: 9000`
      # no cambia -- es el puerto interno por defecto de SonarQube dentro
      # del contenedor, solo se remapea el lado publicado. `mode: ingress`
      # (2026-08-31) -- sigue pinnado a un nodo fijo (ver cabecera, `data/`
      # real), pero ya no hay ninguna colisión real de puerto que exija
      # `mode: host` (mismo criterio ya aplicado a `capataz-api`/
      # `infisical`/`open-webui`/`portainer-server`).
      - target: 9000
        published: 19000
        mode: ingress
    networks:
      - sonarqube-net
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    logging:
      driver: loki
      options:
        loki-url: "http://192.168.1.171:3100/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==pi-sonar
      restart_policy:
        condition: on-failure

networks:
  sonarqube-net:
    driver: overlay
    attachable: true

configs:
  homelab-ca-bundle-v1:
    external: true

secrets:
  sonarqube-infisical-client-id-v1:
    external: true
  sonarqube-infisical-client-secret-v1:
    external: true
  sonarqube-infisical-project-id-v1:
    external: true

volumes:
  sonarqube-extensions:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.1.180,rw,vers=3"
      device: ":/volume1/nfs-data/sonarqube/extensions"
