# Fase 4 (docs/31-docker-swarm.md): rsshub migrado al swarm.
#
# `constraints: node.hostname==pi-utils` RETIRADO (2026-08-31, decisión
# explícita del usuario). El motivo original (ver historial: el binario de
# `infisical` en una ruta con forma de nodo, `/srv/homelab/pi-utils/...`,
# solo existía ahí) ya no aplica -- pasa a la ruta compartida
# multi-arquitectura (mismo mecanismo que `authentik`/`bifrost`/etc.).
# `/app/data` -- comprobado en vivo que está completamente vacío
# (`CACHE_TYPE: memory` ya delata que RSSHub cachea en memoria del proceso,
# no en disco) -- pasa de bind-mount a `tmpfs`, nada real que perder ni que
# migrar.
version: "3.8"

services:
  rsshub:
    image: diygod/rsshub:latest
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      CACHE_EXPIRE: "300"
      PUPPETEER_WS_ENDPOINT: ""
      NO_LOGFILES: "true"
      # Mejora 41 (2026-08-28): cert real de Let's Encrypt, pero SSL_CERT_FILE
      # SIGUE haciendo falta -- esta imagen (Debian, sin `ca-certificates`)
      # no trae ningún almacén de CAs del sistema (hallazgo real, ver
      # apikey-service). homelab-ca.crt pasa a ser un bundle combinado (CA
      # interna + almacén público estándar), no solo la CA interna.
      INFISICAL_DOMAIN: https://infisical.404labo.net/api
      SSL_CERT_FILE: /etc/ssl/certs/homelab-ca.crt
    volumes:
      - /srv/homelab/infisical/infisical-cli/infisical:/usr/local/bin/infisical:ro
      - type: tmpfs
        target: /app/data
        tmpfs:
          size: 16777216
    configs:
      # homelab-ca-bundle-v1: compartido con 10 stacks más (2026-08-31,
      # confirmado por md5sum idéntico) -- ver docker-swarm/stacks/authentik/
      # docker-compose.yml para la explicación completa.
      - source: homelab-ca-bundle-v1
        target: /etc/ssl/certs/homelab-ca.crt
    secrets:
      - source: rsshub-infisical-client-id-v1
        target: rsshub-infisical-client-id
      - source: rsshub-infisical-client-secret-v1
        target: rsshub-infisical-client-secret
      - source: rsshub-infisical-project-id-v1
        target: rsshub-infisical-project-id
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        CLIENT_ID=$$(cat /run/secrets/rsshub-infisical-client-id) &&
        CLIENT_SECRET=$$(cat /run/secrets/rsshub-infisical-client-secret) &&
        PROJECT_ID=$$(cat /run/secrets/rsshub-infisical-project-id) &&
        TOKEN=$$(infisical login --method=universal-auth \
          --client-id="$$CLIENT_ID" \
          --client-secret="$$CLIENT_SECRET" \
          --plain --silent) &&
        exec infisical run --token="$$TOKEN" --projectId="$$PROJECT_ID" --env=prod --path=/rsshub/ -- \
          dumb-init -- npm run start
    ports:
      - "1200:1200"
    networks:
      - rsshub-net
    logging:
      driver: loki
      options:
        loki-url: "http://192.168.1.171:3100/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  rsshub-net:
    driver: overlay
    attachable: true

configs:
  homelab-ca-bundle-v1:
    external: true

secrets:
  rsshub-infisical-client-id-v1:
    external: true
  rsshub-infisical-client-secret-v1:
    external: true
  rsshub-infisical-project-id-v1:
    external: true
