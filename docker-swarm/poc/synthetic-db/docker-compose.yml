# PoC Fase 0 (docs/31-docker-swarm.md): valida el patrón real que usará todo
# servicio con estado bajo Swarm — bind-mount local + `constraints:
# node.hostname==<nodo>` para que el scheduler nunca lo reprograme a otro
# sitio. Datos SIEMPRE sintéticos, nunca una copia de una base de datos real.
#
# Desplegar con: docker stack deploy -c docker-compose.yml poc-swarm
# (ejecutado en pinchi — ver README.md de este directorio para el paso a paso)
version: "3.8"

services:
  poc-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: poc_swarm
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc-solo-para-pruebas-no-es-un-secreto-real
    volumes:
      - /srv/homelab/pinchi/docker-swarm-poc/postgres/data:/var/lib/postgresql/data
      - /srv/homelab/pinchi/docker-swarm-poc/postgres/seed:/docker-entrypoint-initdb.d:ro
    networks:
      - poc-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == pinchi
      restart_policy:
        condition: on-failure

networks:
  poc-net:
    driver: overlay
    attachable: true
