// =============================================================================
// 20auto-upgrades.conf
// Sustituye a /etc/apt/apt.conf.d/20auto-upgrades — activa la comprobación e
// instalación periódica de actualizaciones (temporizadores systemd
// apt-daily.timer / apt-daily-upgrade.timer). Sin esto, unattended-upgrades
// puede estar instalado pero nunca ejecutarse solo.
// =============================================================================

APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
APT::Periodic::AutocleanInterval "7";
