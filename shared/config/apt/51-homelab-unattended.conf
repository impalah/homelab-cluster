// =============================================================================
// 51-homelab-unattended.conf
// Ajustes propios del clúster para unattended-upgrades, en un fichero aparte
// del 50unattended-upgrades que trae el paquete (así no hay que tocar el
// fichero gestionado por dpkg, y no aparecen prompts de conffile modificado
// en cada actualización del propio paquete).
//
// Deja el comportamiento por defecto de Ubuntu para QUÉ se actualiza (solo
// origins de seguridad + ESM, ver Unattended-Upgrade::Allowed-Origins en
// 50unattended-upgrades — no se toca aquí), y solo fija explícitamente que
// NUNCA reinicie el equipo solo. Ver docs/16-mantenimiento-actualizaciones.md.
// =============================================================================

Unattended-Upgrade::Automatic-Reboot "false";
Unattended-Upgrade::Automatic-Reboot-WithUsers "false";
Unattended-Upgrade::Remove-Unused-Dependencies "true";
Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
