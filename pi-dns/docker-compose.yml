name: homelab-pi-dns

# =============================================================================
# Stack del nodo pi-dns (192.168.1.170)
# Servicios: unbound (DNS recursivo), pihole (DNS autoritativo + ad-block), nginx (proxy inverso)
# IMPORTANTE: systemd-resolved debe estar deshabilitado en el host antes de arrancar.
# =============================================================================

# Logs -> driver `loki` nativo de Docker en vez de Promtail (docs/31-docker-swarm.md,
# Fase 1) -- plugin arm64 oficial (grafana/loki-docker-driver:3.7.2-arm64), no
# ":latest" (no es un manifest multi-arch real, resuelve a x86_64 en Raspberry
# Pi). Funciona igual con `network_mode: host` (tailscale) -- el driver de
# logging es independiente del modo de red.
x-logging: &loki-logging
  driver: loki
  options:
    loki-url: "http://192.168.1.171:3100/loki/api/v1/push"
    loki-external-labels: "node=pi-dns"
    mode: non-blocking
    max-buffer-size: 4m

services:

  # ---------------------------------------------------------------------------
  # nut-upsmon — cliente NUT: monitoriza el SAI remoto en pi-obs
  # (192.168.1.171:3493) y apaga ESTE host si el SAI ordena un apagado por
  # bateria critica. Ver docs/33-nut-sai.md.
  #
  # privileged: true IMPRESCINDIBLE -- confirmado en vivo (pinchi,
  # 2026-09-01): sin el, AppArmor bloquea la conexion D-Bus al host real
  # ("AppArmor policy prevents this sender..."), y el apagado real fallaria
  # en silencio justo cuando mas falta hace.
  # ---------------------------------------------------------------------------
  nut-upsmon:
    build: /srv/homelab/shared/docker/nut-client
    image: nut-client:local
    container_name: nut-upsmon
    logging: *loki-logging
    restart: unless-stopped
    privileged: true
    environment:
      NUT_MONUSER_PASSWORD: ${NUT_MONUSER_PASSWORD}
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /srv/homelab/shared/config/nut/nut-client.conf:/etc/nut/nut.conf:ro
      - /srv/homelab/shared/config/nut/upsmon-client.conf.template:/etc/nut/upsmon.conf.template:ro
      - /srv/homelab/shared/scripts/nut-shutdown-host.sh:/usr/local/bin/nut-shutdown-host.sh:ro
      - /srv/homelab/shared/scripts/nut-notify.sh:/usr/local/bin/nut-notify.sh:ro
    networks:
      - pi-dns-net

  # ---------------------------------------------------------------------------
  # unbound — Resolvedor DNS recursivo local
  # Escucha en puerto 5335 (interno al host), usado por Pi-hole como upstream
  # ---------------------------------------------------------------------------
  unbound:
    image: mvance/unbound-rpi:latest
    container_name: unbound
    logging: *loki-logging
    restart: unless-stopped
    volumes:
      - /srv/homelab/pi-dns/unbound/config/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
    networks:
      pi-dns-net:
        ipv4_address: 172.20.0.2
    healthcheck:
      test: ["CMD-SHELL", "drill -p 5335 @127.0.0.1 example.com || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # pihole — Servidor DNS con bloqueo de anuncios
  # Escucha en puerto 53 del host (requiere systemd-resolved deshabilitado)
  # ---------------------------------------------------------------------------
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    logging: *loki-logging
    restart: unless-stopped
    depends_on:
      unbound:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Madrid}
      # Pi-hole v6 ya no usa WEBPASSWORD (variable de v5, ignorada silenciosamente)
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      PIHOLE_DNS_: ${PIHOLE_DNS_1:-172.20.0.2#5335}
      DNSSEC: ${PIHOLE_DNSSEC:-false}
      VIRTUAL_HOST: ${VIRTUAL_HOST:-pi-dns.404labo.net}
      # Pi-hole v6 ya no usa DNSMASQ_LISTENING (variable de v5, ignorada
      # silenciosamente). Sin esto, Pi-hole rechaza consultas de cualquier
      # IP que no considere "red local" (ve la red interna de Docker como
      # local, pero no la LAN real 192.168.1.0/24) con el error de log
      # "dnsmasq: ignoring query from non-local network".
      FTLCONF_dns_listeningMode: ALL
      # Deshabilitar DHCP de Pi-hole (el router gestiona DHCP)
      DHCP_ACTIVE: "false"
    volumes:
      - /srv/homelab/pi-dns/pihole/etc-pihole:/etc/pihole
      - /srv/homelab/pi-dns/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      # Mejora 41 (cierre, 2026-08-28): antes solo en 127.0.0.1 -- nginx
      # hacía de intermediario para el resto de la LAN vía pihole.home.arpa.
      # Con nginx decomisionado, el panel se publica directo en la interfaz
      # real del host, sin hostname ni proxy delante (decisión explícita del
      # usuario) -- accesible en http://192.168.1.170:8053.
      - "8053:80"
    networks:
      pi-dns-net:
        ipv4_address: 172.20.0.3
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "dig +short +norecurse +retry=0 @127.0.0.1 pi.hole || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # apikey-service y nginx — RETIRADOS (mejora 41, cierre, 2026-08-28).
  #
  # nginx era el proxy inverso original de *.home.arpa; desde el cutover de
  # DNS de la mejora 33/39 (2026-08-26) ya no servía tráfico real (todos los
  # hostnames apuntaban a Traefik en el Swarm), se dejaba desplegado sin
  # tocar solo como vía de rollback inmediata. Con la mejora 41 cerrada
  # (todo *.404labo.net verificado sano, home.arpa retirado de Pi-hole) ese
  # rollback deja de tener sentido -- se paró y se retiró el contenedor. Su
  # config (pi-dns/config/nginx/) se deja en el repo como referencia
  # histórica, no se despliega en ningún sitio. El certificado de
  # *.home.arpa (generate-cert.sh) queda igual de obsoleto -- no se genera
  # ninguno nuevo.
  #
  # apikey-service (esta copia local) solo existía para el auth_request de
  # nginx -- el Swarm tiene su propia instancia canónica
  # (docker-swarm/stacks/apikey-service/, la que usa el middleware
  # apikey-auth de Traefik), alcanzable en cualquier nodo por routing mesh
  # en el puerto 8091 (p. ej. http://192.168.1.175:8091) para gestión
  # administrativa directa. Sin nginx, esta copia de pi-dns no tenía ya
  # ningún consumidor -- se retiró junto con él en vez de dejarla huérfana.
  #
  # La CA interna del clúster (generate-ca.sh, pi-dns/config/nginx/ca/) SÍ
  # se conserva -- Valkey (docker-swarm/stacks/valkey/) sigue firmando su
  # certificado TLS con ella, es el único consumidor que queda tras esta
  # mejora (ver shared/dns/dns-records.md).
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # tailscale — Subnet router: acceso remoto autenticado a toda la LAN
  # (192.168.1.0/24) vía Tailscale, incluida la resolución de *.404labo.net
  # (Split DNS configurado en el panel de Tailscale, apuntando a este mismo
  # nodo — ver docs/18-tailscale.md; "Restrict to domain" movido de
  # home.arpa a 404labo.net al cerrar la mejora 41, 2026-08-28). network_mode: host a propósito — un
  # subnet router necesita la interfaz de red real del host, no la red bridge
  # de Docker. TS_ACCEPT_DNS=false porque este nodo YA es el servidor DNS del
  # clúster (Pi-hole+Unbound) — dejar que Tailscale reescriba su propio
  # resolv.conf rompería esa configuración. Sin label de watchtower a
  # propósito — es la puerta de acceso remoto al clúster entero, no se
  # auto-actualiza sin revisión (docs/16-mantenimiento-actualizaciones.md).
  # ---------------------------------------------------------------------------
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    logging: *loki-logging
    hostname: pi-dns
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      # Con "volumes:" en vez de "devices:" el contenedor no ve un nodo TUN
      # real y tailscaled cae solo a "--tun=userspace-networking", que no
      # sirve para hacer de subnet router (no puede enrutar tráfico ajeno a
      # nivel de kernel) — pasó de verdad al desplegar por primera vez.
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: --advertise-routes=192.168.1.0/24 --accept-dns=false
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      - /srv/homelab/pi-dns/tailscale/state:/var/lib/tailscale
      # Sin esto, el iptables (legacy) del contenedor no encuentra los módulos
      # del kernel del host (modprobe: can't change directory to
      # '/lib/modules') y falla al montar la tabla "filter" — necesaria para
      # las reglas NAT/forwarding del subnet router. Pasó de verdad en el
      # primer despliegue (Raspberry Pi OS, kernel raspi).
      - /lib/modules:/lib/modules:ro

  # ---------------------------------------------------------------------------
  # node-exporter — Métricas del sistema host, scrapeadas por Prometheus en pi-obs
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: node-exporter
    logging: *loki-logging
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      pi-dns-net:
        ipv4_address: 172.20.0.5
    pid: host

  # ---------------------------------------------------------------------------
  # cadvisor — Métricas de contenedores Docker, scrapeadas por Prometheus en pi-obs
  # ---------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    logging: *loki-logging
    restart: unless-stopped
    command:
      - "-disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp,disk,diskIO"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks:
      pi-dns-net:
        ipv4_address: 172.20.0.6
    privileged: true
    cgroup: host
    devices:
      - /dev/kmsg

  # ---------------------------------------------------------------------------
  # portainer-agent — Expone el Docker de este nodo a Portainer (servidor en
  # pi-utils). Ver docs/10-instalacion-pi4-utils.md.
  # ---------------------------------------------------------------------------
  portainer-agent:
    image: portainer/agent:2.42.0
    container_name: portainer-agent
    logging: *loki-logging
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      AGENT_CLUSTER_ADDR: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - "9001:9001"
    networks:
      pi-dns-net:
        ipv4_address: 172.20.0.7

  # ---------------------------------------------------------------------------
  # watchtower — Auto-actualiza SOLO los contenedores con la label
  # com.centurylinklabs.watchtower.enable=true (node-exporter, cadvisor,
  # portainer-agent) — servicios sin estado. pihole, unbound y nginx NUNCA se
  # auto-actualizan — ver docs/16-mantenimiento-actualizaciones.md.
  # ---------------------------------------------------------------------------
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    logging: *loki-logging
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      pi-dns-net:
        ipv4_address: 172.20.0.8

  # ---------------------------------------------------------------------------
  # promtail — migrado al driver de logging `loki` nativo de Docker (ver
  # x-logging arriba) — docs/31-docker-swarm.md. Ya no se despliega aquí.
  # ---------------------------------------------------------------------------

networks:
  pi-dns-net:
    name: pi-dns-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
