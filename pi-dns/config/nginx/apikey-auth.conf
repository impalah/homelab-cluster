# =============================================================================
# apikey-auth.conf
# Snippet para proteger un servicio con el apikey-service (auth_request).
# Ver docs/06-instalacion-pi1-dns.md para la gestión de keys (crear/listar/revocar)
# y el razonamiento completo. Resumen de uso:
#
#   server {
#       listen 443 ssl;
#       server_name mi-servicio.home.arpa;
#
#       include /etc/nginx/apikey-auth.conf;   # <- define la location interna
#
#       location / {
#           auth_request /_apikey_validate;    # <- exige X-Api-Key válida
#           proxy_pass http://192.168.1.X:PUERTO;
#           include /etc/nginx/proxy-common.conf;
#       }
#   }
#
# El cliente debe enviar la cabecera:  X-Api-Key: <key>
# Si falta o no es válida, nginx devuelve 401 sin ni siquiera llegar al
# backend real. Para dejar un servicio SIN proteger (comportamiento por
# defecto de todos los server{} de este fichero), simplemente no incluyas
# este snippet ni la línea "auth_request" — no hace falta nada más.
# =============================================================================

location = /_apikey_validate {
    internal;
    resolver 127.0.0.11 valid=10s;
    set $apikey_backend apikey-service;
    proxy_pass http://$apikey_backend:8090/validate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Api-Key $http_x_api_key;
    proxy_set_header X-Real-IP $remote_addr;
}
