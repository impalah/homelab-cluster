# =============================================================================
# nginx.conf — Proxy inverso para homelab-cluster
# Nodo: pi-dns (192.168.1.170)
# TLS: certificado firmado por la CA interna del clúster, validez larga
# (ver generate-ca.sh / generate-cert.sh, y docs/15-ca-interna.md).
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Necesario para que proxy-common.conf pueda hacer upgrade a WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    ssl_certificate     /etc/nginx/certs/home-arpa.crt;
    ssl_certificate_key /etc/nginx/certs/home-arpa.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # -------------------------------------------------------------------
    # Cómo proteger un servicio con API key (apikey-service)
    # -------------------------------------------------------------------
    # Por defecto NINGÚN server{} de este fichero exige autenticación —
    # cualquiera en la LAN con el hostname .home.arpa correcto entra
    # directo al backend. Para exigir una API key propia en un servicio
    # concreto (p. ej. uno sin login propio, como ollama.home.arpa):
    #
    #   1. Añade "include /etc/nginx/apikey-auth.conf;" a nivel de server{}
    #   2. Añade "auth_request /_apikey_validate;" dentro del location{}
    #      que quieras proteger (antes del proxy_pass)
    #
    # Ver /etc/nginx/apikey-auth.conf (mismo ejemplo completo) y
    # docs/06-instalacion-pi1-dns.md (gestión de keys: crear/listar/revocar,
    # despliegue, troubleshooting). Para NO proteger un servicio, que es
    # el estado por defecto de todos los bloques de abajo, simplemente no
    # toques nada — no hay opt-out explícito porque no hace falta.
    # -------------------------------------------------------------------

    # Endpoint de salud interno, independiente de los backends proxificados
    server {
        listen 8080;
        server_name _;
        location /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # Redirección HTTP -> HTTPS para cualquier host, salvo /ca.crt: hay que
    # poder descargar la CA por HTTP plano (todavía no se confía en ella,
    # así que HTTPS con este mismo certificado no serviría de nada aquí).
    server {
        listen 80 default_server;
        server_name _;

        location = /ca.crt {
            alias /etc/nginx/ca.crt;
            default_type application/x-x509-ca-cert;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------------
    # pi-dns (192.168.1.170) — panel estático de acceso a los servicios del
    # clúster (no es un proxy — sirve el HTML/CSS/iconos directamente).
    # ---------------------------------------------------------------------

    server {
        listen 443 ssl;
        server_name index.home.arpa;
        root /etc/nginx/index-html;
        index index.html;
        location / {
            try_files $uri $uri/ =404;
        }
    }

    # ---------------------------------------------------------------------
    # pi-dns (192.168.1.170) — apikey-service (gestión de API keys propias)
    # Protegido por su propio ADMIN_TOKEN a nivel de aplicación en
    # POST/GET/DELETE /keys — no necesita auth_request aquí (sería proteger
    # con una key el propio servicio que las emite). /validate se deja
    # accesible: solo confirma si UNA key concreta es válida o no, no
    # expone nada sensible sin conocer ya esa key. Ver docs/06-instalacion-pi1-dns.md
    # ---------------------------------------------------------------------

    server {
        listen 443 ssl;
        server_name apikey.home.arpa;
        # Resolución diferida — mismo motivo que pihole.home.arpa más abajo:
        # evita que nginx se niegue a arrancar si apikey-service no está
        # listo en ese instante exacto (p. ej. tras un reboot del host).
        resolver 127.0.0.11 valid=10s;
        set $apikey_service_backend apikey-service;
        location / {
            proxy_pass http://$apikey_service_backend:8090;
            include /etc/nginx/proxy-common.conf;
        }
    }

    # ---------------------------------------------------------------------
    # pi-dns (192.168.1.170) — panel de administración de Pi-hole
    # ---------------------------------------------------------------------

    server {
        listen 443 ssl;
        server_name pihole.home.arpa;
        # Resolución diferida (por petición), no en el arranque: es el único
        # upstream de este fichero que referencia un nombre de contenedor en
        # vez de una IP de LAN. Si se resolviera al arrancar (proxy_pass
        # http://pihole:80 directo) y pihole no estuviera listo en ese
        # instante exacto (p. ej. tras un reboot del host, donde Docker no
        # respeta el orden de depends_on), nginx no arrancaría en absoluto:
        # "host not found in upstream". Con resolver + variable, nginx
        # arranca igual y solo esa ruta concreta da 502 hasta que pihole
        # esté disponible.
        resolver 127.0.0.11 valid=10s;
        set $pihole_backend pihole;
        location / {
            proxy_pass http://$pihole_backend:80;
            include /etc/nginx/proxy-common.conf;
        }
    }

    # ---------------------------------------------------------------------
    # Ryzen (192.168.1.150)
    # ---------------------------------------------------------------------

    server {
        listen 443 ssl;
        server_name openwebui.home.arpa;
        # Migrado de ryzen (192.168.1.150) a retaco (192.168.1.174) — ver
        # docs/23-bifrost-gateway-llm.md, sección de migración. Sigue
        # accesible con ryzen apagado; habla con Bedrock/Ollama vía Bifrost,
        # no con Ollama directo.
        location / {
            proxy_pass http://192.168.1.174:8080;
            include /etc/nginx/proxy-common.conf;
        }
    }

    server {
        listen 443 ssl;
        server_name n8n.home.arpa;
        location / {
            proxy_pass http://192.168.1.174:5678;
            include /etc/nginx/proxy-common.conf;
        }
    }

    server {
        listen 443 ssl;
        server_name ollama.home.arpa;
        # Protegido con apikey-service — ver docs/06-instalacion-pi1-dns.md.
        # No afecta a open-webui: llega a ollama por la red Docker interna
        # de ryzen (http://ollama:11434), sin pasar por aquí.
        include /etc/nginx/apikey-auth.conf;
        location / {
            auth_request /_apikey_validate;
            proxy_pass http://192.168.1.150:11434;
            include /etc/nginx/proxy-common.conf;
            # Generar una respuesta larga (p. ej. limpiar markdown con un
            # LLM, /api/generate con salida de miles de tokens) supera de
            # sobra el timeout por defecto de nginx (60s) aunque el modelo
            # esté caliente en VRAM -- 504 aunque Ollama siga trabajando
            # con normalidad. Solo se sube aquí (no en proxy-common.conf)
            # para no afectar a qdrant/registry/vllm/comfyui.
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }
    }

    server {
        listen 443 ssl;
        server_name vllm.home.arpa;
        # Mismo esquema que ollama.home.arpa — ver docs/07-instalacion-ryzen.md.
        # open-webui también le llega por red Docker interna de ryzen
        # (http://vllm:8000), sin pasar por aquí ni necesitar la key.
        include /etc/nginx/apikey-auth.conf;
        location / {
            auth_request /_apikey_validate;
            proxy_pass http://192.168.1.150:8010;
            include /etc/nginx/proxy-common.conf;
        }
    }

    server {
        listen 443 ssl;
        server_name comfyui.home.arpa;
        # Mismo esquema que ollama.home.arpa/vllm.home.arpa — ComfyUI no
        # tiene autenticación propia. Ver docs/07-instalacion-ryzen.md.
        include /etc/nginx/apikey-auth.conf;
        location / {
            auth_request /_apikey_validate;
            proxy_pass http://192.168.1.150:8188;
            include /etc/nginx/proxy-common.conf;
        }
    }

    server {
        listen 443 ssl;
        server_name qdrant.home.arpa;
        location / {
            proxy_pass http://192.168.1.174:6333;
            include /etc/nginx/proxy-common.conf;
        }
    }

    server {
        listen 443 ssl;
        server_name epub2pdf.home.arpa;
        # Protegido con apikey-service — sin esto, /convert acepta ficheros
        # de cualquiera en la LAN sin ninguna credencial. Mismo criterio que
        # markitdown.home.arpa. Ver docs/05-instalacion-retaco.md sección 5.4.
        include /etc/nginx/apikey-auth.conf;
        location / {
            auth_request /_apikey_validate;
            proxy_pass http://192.168.1.174:8003;
            include /etc/nginx/proxy-common.conf;
        }
    }

    server {
        listen 443 ssl;
        server_name pdf2chunks.home.arpa;
        # Protegido con apikey-service — mismo criterio que epub2pdf.home.arpa.
        include /etc/nginx/apikey-auth.conf;
        location / {
            auth_request /_apikey_validate;
            proxy_pass http://192.168.1.174:8004;
            include /etc/nginx/proxy-common.conf;
        }
    }

    server {
        listen 443 ssl;
        server_name registry.home.arpa;
        # NO va con apikey-auth.conf: los clientes Docker (docker
        # login/push/pull) hablan Basic Auth nativo contra el propio
        # registry (REGISTRY_AUTH=htpasswd en retaco), no mandan X-Api-Key
        # — auth_request aquí rompería docker login. Sin límite de tamaño
        # de body ni buffering: las capas de imagen (whisper-service, con
        # base nvidia/cuda) pueden pesar varios GB.
        client_max_body_size 0;
        chunked_transfer_encoding on;
        location / {
            proxy_pass http://192.168.1.174:5000;
            include /etc/nginx/proxy-common.conf;
            proxy_request_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }
    }

    server {
        listen 443 ssl;
        server_name whisper.home.arpa;
        location / {
            proxy_pass http://192.168.1.150:9800;
            include /etc/nginx/proxy-common.conf;
        }
    }

    # ---------------------------------------------------------------------
    # pi-obs (192.168.1.171)
    # ---------------------------------------------------------------------

    server {
        listen 443 ssl;
        server_name grafana.home.arpa;
        location / {
            proxy_pass http://192.168.1.171:3000;
            include /etc/nginx/proxy-common.conf;
        }
    }

    server {
        listen 443 ssl;
        server_name prometheus.home.arpa;
        location / {
            proxy_pass http://192.168.1.171:9090;
            include /etc/nginx/proxy-common.conf;
        }
    }

    # ---------------------------------------------------------------------
    # pi-sonar (192.168.1.172)
    # ---------------------------------------------------------------------

    server {
        listen 443 ssl;
        server_name sonarqube.home.arpa;
        location / {
            proxy_pass http://192.168.1.172:9000;
            include /etc/nginx/proxy-common.conf;
        }
    }

    server {
        listen 443 ssl;
        server_name bifrost.home.arpa;
        # NO va con apikey-auth.conf: Bifrost tiene su propio sistema nativo
        # de autenticación (virtual keys, "governance"), exigido en origen
        # vía enforce_auth_on_inference=true en config/bifrost/config.json —
        # doble capa de apikey-service encima sería redundante, mismo
        # criterio que apikey.home.arpa/registry.home.arpa. El cliente manda
        # su propia cabecera (Authorization: Bearer <virtual key>, o
        # x-bf-vk) directo al backend. Ver docs/23-bifrost-gateway-llm.md.
        location / {
            proxy_pass http://192.168.1.172:8080;
            include /etc/nginx/proxy-common.conf;
            # Visto en producción (agosto 2026): qwen3.5:27b vía Ollama
            # (ryzen) tardó 68.3s en responder (confirmado en el log de
            # Bifrost, request_duration_ms=68261, 200 OK) — por encima del
            # timeout por defecto de nginx (60s), que cortaba la conexión al
            # cliente con 504 antes de que Bifrost pudiera entregar la
            # respuesta ya generada. Bedrock siempre había respondido dentro
            # de los 60s por defecto; los modelos locales grandes
            # (qwen2.5:32b, 19.9 GB, sería aún más lento) no. Ver
            # docs/23-bifrost-gateway-llm.md, tabla de troubleshooting.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    # ---------------------------------------------------------------------
    # pi-utils (192.168.1.173)
    # ---------------------------------------------------------------------

    server {
        listen 443 ssl;
        server_name rsshub.home.arpa;
        location / {
            proxy_pass http://192.168.1.173:1200;
            include /etc/nginx/proxy-common.conf;
        }
    }

    server {
        listen 443 ssl;
        server_name markitdown.home.arpa;
        # Protegido con apikey-service — sin esto, /convert acepta
        # documentos de cualquiera en la LAN sin ninguna credencial.
        # Ver docs/06-instalacion-pi1-dns.md.
        include /etc/nginx/apikey-auth.conf;
        location / {
            auth_request /_apikey_validate;
            proxy_pass http://192.168.1.173:8001;
            include /etc/nginx/proxy-common.conf;
        }
    }

    server {
        listen 443 ssl;
        # Sub-subdominio a propósito (crawl4ai.scraper.home.arpa, no
        # crawl4ai-scraper.home.arpa) — decisión explícita, no un error de
        # naming. Pi-hole/nginx no tienen problema con niveles adicionales
        # de subdominio, es solo una cadena más en server_name.
        server_name crawl4ai.scraper.home.arpa;
        # Protegido con apikey-service — mismo criterio que markitdown.home.arpa:
        # /scrape ejecuta un navegador real contra la URL que le pidan, no
        # puede quedar abierto a cualquiera en la LAN. Ver docs/06-instalacion-pi1-dns.md.
        include /etc/nginx/apikey-auth.conf;
        location / {
            auth_request /_apikey_validate;
            proxy_pass http://192.168.1.173:8002;
            include /etc/nginx/proxy-common.conf;
            # /scrape puede tardar hasta SCRAPE_TIMEOUT_SECONDS (60s por
            # defecto) en responder — el default de nginx para
            # proxy_read_timeout es también 60s, justo al límite.
            proxy_read_timeout 90s;
        }
    }

    server {
        listen 443 ssl;
        server_name n8n-aux.home.arpa;
        location / {
            proxy_pass http://192.168.1.173:5679;
            include /etc/nginx/proxy-common.conf;
        }
    }

    server {
        listen 443 ssl;
        server_name portainer.home.arpa;
        location / {
            proxy_pass http://192.168.1.173:9000;
            include /etc/nginx/proxy-common.conf;
        }
    }

    server {
        listen 443 ssl;
        server_name vaultwarden.home.arpa;
        location / {
            proxy_pass http://192.168.1.173:8222;
            include /etc/nginx/proxy-common.conf;
        }
    }
}
