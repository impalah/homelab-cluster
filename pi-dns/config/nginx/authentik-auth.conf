# =============================================================================
# authentik-auth.conf
# Snippet para proteger un servicio con Authentik (forward-auth, modo SINGLE
# APPLICATION, outpost embebido) — protege a PERSONAS con sesión de
# navegador, no consumidores máquina (para eso está apikey-auth.conf). Ver
# docs/27-authentik-sso.md para el razonamiento completo y cómo se creó el
# Proxy Provider en la UI de Authentik. Resumen de uso:
#
#   server {
#       listen 443 ssl;
#       server_name mi-servicio.home.arpa;
#
#       include /etc/nginx/authentik-auth.conf;   # <- define las locations internas
#
#       location / {
#           auth_request /outpost.goauthentik.io/auth/nginx;
#           error_page 401 = @goauthentik_proxy_signin;
#           proxy_pass http://192.168.1.X:PUERTO;
#           include /etc/nginx/proxy-common.conf;
#       }
#   }
#
# NO modo "domain level" — descartado tras fallar en producción: "home.arpa"
# está en la Public Suffix List de los navegadores (RFC 8375 lo reserva
# explícitamente como dominio de homenet, igual que ".com"), así que ningún
# navegador acepta una cookie de sesión con Domain=home.arpa — se descarta en
# silencio, sin error visible, y el callback del outpost falla con
# "mismatched session ID"/"invalid state" (400). Cada servicio protegido con
# este snippet necesita su PROPIO Proxy Provider en modo "Forward auth
# (single application)", con External Host = su propia URL
# (https://mi-servicio.home.arpa) — la cookie de sesión queda entonces
# scoped a ese dominio real, no a un sufijo de la PSL. Sin sesión compartida
# entre servicios protegidos — cada uno pide login por separado.
#
# Sin sesión válida, el cliente es redirigido al login de Authentik (no un
# 401 seco como con apikey-service) — tras autenticarse, Authentik lo manda
# de vuelta a la URL original.
#
# El Proxy Provider debe estar asignado al outpost "authentik Embedded
# Outpost" para que /outpost.goauthentik.io responda — en esta versión no
# se asigna solo, hay que añadirlo a mano desde Applications → Outposts →
# editar → Assigned applications.
# =============================================================================

auth_request_set $auth_cookie $upstream_http_set_cookie;
add_header Set-Cookie $auth_cookie;

# Identidad de la persona autenticada, disponible para el backend si el
# server{} que incluye este snippet añade sus propios "proxy_set_header"
# dentro de su location protegida (Prometheus no los necesita, otro
# servicio protegido en el futuro sí podría).
auth_request_set $authentik_username $upstream_http_x_authentik_username;
auth_request_set $authentik_groups $upstream_http_x_authentik_groups;
auth_request_set $authentik_email $upstream_http_x_authentik_email;
auth_request_set $authentik_name $upstream_http_x_authentik_name;
auth_request_set $authentik_uid $upstream_http_x_authentik_uid;

# Por IP directa al contenedor authentik-server (retaco), no vía
# authentik.home.arpa — es una llamada interna nginx-to-backend, mismo
# criterio que el resto de bloques cross-host de este fichero (qdrant,
# n8n-main...), sin salto extra de vuelta a través del propio nginx.
location = /outpost.goauthentik.io/auth/nginx {
    internal;
    proxy_pass http://192.168.1.174:9000/outpost.goauthentik.io/auth/nginx;
    proxy_set_header Host $host;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Sin esto, Authentik ve la conexión interna nginx→authentik-server como
    # HTTP plano (no sabe que el cliente real llegó por HTTPS) y la
    # validación del callback OAuth2-style del outpost falla con 400 —
    # encontrado en vivo protegiendo prometheus.home.arpa: login correcto,
    # pero el /callback devolvía "HTTP ERROR 400" hasta añadir esta cabecera.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

location /outpost.goauthentik.io {
    proxy_pass http://192.168.1.174:9000/outpost.goauthentik.io;
    proxy_set_header Host $host;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 90s;
    # Las cookies/cabeceras de Authentik (JWT de estado en el callback,
    # visto en vivo) pueden superar el buffer por defecto de nginx —
    # mismo ajuste que trae la plantilla oficial de Authentik para nginx.
    proxy_buffers 8 16k;
    proxy_buffer_size 32k;
}

# Redirección al login — RELATIVA (sin esquema/host), a propósito: en modo
# single-application todo el flujo (start, authorize, callback) se queda en
# el propio dominio del servicio protegido (p. ej. prometheus.home.arpa), no
# salta a authentik.home.arpa — así la cookie de sesión que pone Authentik
# queda scoped a ese dominio real y el navegador la acepta (ver aviso de la
# cabecera del fichero sobre la Public Suffix List).
location @goauthentik_proxy_signin {
    internal;
    return 302 /outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
}
