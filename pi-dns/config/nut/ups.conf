# Salicru SPS 2200 SOHO+ -- confirmado en vivo contra el hardware real
# (docs/33-nut-sai.md): driver usbhid-ups, subdriver "Phoenixtec/Liebert
# HID" detectado solo, sin necesitar nutdrv_qx/blazer_usb ni el flag
# -x pollonly.
#
# user = root (global, aplica a todos los drivers de este fichero): el
# comportamiento por defecto de NUT es arrancar como root y hacer drop de
# privilegios al usuario "nut" antes de abrir el dispositivo USB real. Esto
# funciona en el host bare-metal porque la regla udev del paquete pone el
# dispositivo a nombre del "nut" DEL HOST -- pero dentro de este contenedor
# el usuario "nut" tiene un UID/GID distinto (asignado por apt al construir
# la imagen), que no coincide con el permiso real del fichero de
# /dev/bus/usb montado desde el host. Confirmado en vivo: con el drop de
# privilegios activo, usbhid-ups falla con "insufficient permissions on
# everything" pese a `privileged: true` y el bind-mount de todo
# /dev/bus/usb. Como el contenedor ya es privileged (pensado para esto),
# mantener el driver como root evita depender de que el UID/GID de "nut"
# coincida entre host y contenedor.
user = root

[sai]
    driver = usbhid-ups
    port = auto
    vendorid = 06da
    productid = ffff
    desc = "SAI fisico del cluster -- USB en pi-obs"
