server:
    # Escuchar en todas las interfaces, puerto 5335 (Pi-hole es el único cliente)
    interface: 0.0.0.0
    port: 5335
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Permitir consultas desde la red Docker interna (pi-dns-net: 172.20.0.0/24)
    # y desde el host (127.0.0.1)
    access-control: 127.0.0.0/8 allow
    access-control: 172.20.0.0/24 allow
    access-control: 0.0.0.0/0 refuse

    # Directorio base. Sin "root-hints": esta imagen no incluye ese fichero,
    # usa los root hints compilados en el propio binario de unbound.
    directory: "/opt/unbound/etc/unbound"

    # DNSSEC — ruta real donde el entrypoint de la imagen genera la clave
    # con "unbound-anchor" en cada arranque (incluye el subdirectorio "var/").
    auto-trust-anchor-file: "/opt/unbound/etc/unbound/var/root.key"

    # Mandar logs a stdout/stderr en vez de syslog, para que "docker logs" los capture
    use-syslog: no

    # Privacidad y seguridad
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: yes
    harden-large-queries: yes
    harden-short-bufsize: yes

    # Caché
    cache-min-ttl: 300
    cache-max-ttl: 86400
    serve-expired: yes
    serve-expired-ttl: 3600

    # Rendimiento
    # num-threads a propósito por ENCIMA de los 4 núcleos físicos de la Pi 5:
    # la resolución recursiva pasa la mayor parte del tiempo esperando
    # respuesta de servidores remotos (I/O-bound, no CPU-bound), así que más
    # hilos que núcleos absorbe mejor picos de peticiones simultáneas sin
    # saturar. Subido tras un incidente real: un workflow de n8n (retaco)
    # generando 353 consultas DNS en el mismo segundo (RSS Fetch & Store,
    # resolviendo decenas de feeds a la vez) agotó la capacidad con
    # num-threads=4, causando timeouts que hacían fallar systemd-resolved en
    # retaco a 1.1.1.1 (que no conoce *.home.arpa) — ver
    # docs/13-troubleshooting.md. *_cache-slabs debe ser potencia de 2 y
    # >= num-threads (uso de locks por slab), subidos en la misma proporción.
    num-threads: 8
    msg-cache-slabs: 8
    rrset-cache-slabs: 8
    infra-cache-slabs: 8
    key-cache-slabs: 8
    rrset-cache-size: 256m
    msg-cache-size: 128m

    # Prefetch para entradas populares
    prefetch: yes
    prefetch-key: yes

    # Log mínimo (sin verbosidad)
    verbosity: 0
    log-queries: no

    # Resolver recursivo (sin reenviadores — consulta directo a las raíces)
    do-not-query-localhost: no

    # EDNS buffer
    edns-buffer-size: 1232

    # Zona local home.arpa → Pi-hole la gestiona, no reenviar a raíces
    local-zone: "home.arpa." nodefault

# No hay forward-zone: Unbound resuelve recursivamente desde las raíces.
# Pi-hole reenvía a Unbound; Unbound no reenvía a nadie más.
