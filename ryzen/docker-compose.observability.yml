name: homelab-ryzen-observability

# =============================================================================
# Stack de OBSERVABILIDAD del nodo Ryzen 9 (192.168.1.150)
# Servicios: node-exporter, cadvisor, portainer-agent
#
# Independiente a propósito de docker-compose.yml (el stack de IA/GPU): se
# puede levantar y dejar corriendo aunque ollama/n8n/whisper estén parados,
# para seguir viendo métricas del host y gestionándolo desde Portainer sin
# necesidad de tener la GPU en marcha. Red propia (no comparte "ryzen-net"
# con el otro compose) y sin ninguna variable de entorno — no depende de
# ryzen/.env, se puede arrancar sin configurar nada.
#
# Arranque independiente:
#   docker compose -f docker-compose.observability.yml up -d
# Parada independiente (no afecta a ollama/n8n/whisper):
#   docker compose -f docker-compose.observability.yml down
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # node-exporter — Métricas del sistema host, scrapeadas por Prometheus en pi-obs
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: node-exporter
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - ryzen-observability-net
    pid: host

  # ---------------------------------------------------------------------------
  # cadvisor — Métricas de contenedores Docker, scrapeadas por Prometheus en pi-obs
  # ---------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    restart: unless-stopped
    command:
      - "-disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp,disk,diskIO"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks:
      - ryzen-observability-net
    privileged: true
    cgroup: host
    devices:
      - /dev/kmsg

  # ---------------------------------------------------------------------------
  # portainer-agent — Expone el Docker de este nodo a Portainer (servidor en
  # pi-utils). Ver docs/10-instalacion-pi4-utils.md.
  # ---------------------------------------------------------------------------
  portainer-agent:
    image: portainer/agent:2.42.0
    container_name: portainer-agent
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      AGENT_CLUSTER_ADDR: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - "9001:9001"
    networks:
      - ryzen-observability-net

  # ---------------------------------------------------------------------------
  # watchtower — Auto-actualiza SOLO los contenedores con la label
  # com.centurylinklabs.watchtower.enable=true (node-exporter, cadvisor,
  # portainer-agent) — servicios sin estado, seguros para actualizar solos.
  # Las bases de datos y n8n-main NUNCA se auto-actualizan — ver
  # docs/16-mantenimiento-actualizaciones.md.
  # ---------------------------------------------------------------------------
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ryzen-observability-net

  # ---------------------------------------------------------------------------
  # promtail — Envía los logs de todos los contenedores de este nodo a Loki
  # (pi-obs), para verlos desde Grafana. Ver docs/04-servicios-comunes.md.
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /srv/homelab/ryzen/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /srv/homelab/ryzen/promtail/data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - ryzen-observability-net

networks:
  ryzen-observability-net:
    name: ryzen-observability-net
    driver: bridge
