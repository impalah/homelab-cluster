[project]
name = "pdf2chunks-service"
version = "0.1.0"
description = "Troceado (chunking) de PDF a fragmentos indexables para el pipeline RAG de homelab"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pymupdf>=1.24.10",
    "loguru>=0.7.2",
]

[project.scripts]
pdf2chunks-service = "pdf2chunks_service.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pysonar>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2chunks_service"]

[tool.pytest.ini_options]
addopts = "--cov=pdf2chunks_service --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# B008 (function call en el valor por defecto de un argumento) se dispara en
# los endpoints por "= Depends(...)" — patrón idiomático de FastAPI, no un
# bug real. Silenciado a propósito (mismo motivo que en apikey-service).
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
