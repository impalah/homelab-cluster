# =============================================================================
# sonar-project.properties
# Config de análisis para pysonar (ver Makefile: make sonar / sonar-check).
# SONAR_HOST_URL y SONAR_TOKEN van por variables de entorno (.env), nunca aquí.
# =============================================================================
sonar.projectKey=markitdown-service
sonar.projectName=markitdown-service
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# Sin esto, el escáner intenta analizar bytecode/artefactos binarios como si
# fueran código fuente (avisos de "Invalid character... UTF-8" en __pycache__,
# etc.) — mismos patrones que .gitignore.
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/.venv/**,**/.pytest_cache/**,**/htmlcov/**
