name: homelab-pi-utils

# =============================================================================
# Stack del nodo pi-utils (192.168.1.173)
# Servicios: rsshub, markitdown-service (build local), n8n-aux
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # rsshub — Agregador RSS/Atom universal
  # ---------------------------------------------------------------------------
  rsshub:
    image: diygod/rsshub:latest
    container_name: rsshub
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      CACHE_EXPIRE: ${RSSHUB_CACHE_EXPIRE:-300}
      ACCESS_KEY: ${RSSHUB_ACCESS_KEY:-}
      PUPPETEER_WS_ENDPOINT: ""
      NO_LOGFILES: "true"
    volumes:
      - /srv/homelab/pi-utils/rsshub/data:/app/data
    ports:
      - "1200:1200"
    networks:
      - pi-utils-net
    healthcheck:
      # RSSHUB_ACCESS_KEY (si está definida) protege también /healthz, así que
      # hay que pasar la key aquí también o el propio healthcheck se bloquea
      # con 403 aunque RSSHub esté perfectamente sano.
      test: ["CMD-SHELL", "curl -sf \"http://localhost:1200/healthz?key=$$ACCESS_KEY\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # markitdown-service — Conversión de documentos a Markdown (FastAPI + uv)
  # Imagen del registry privado del clúster (registry.home.arpa), NO se
  # construye aquí — build/push vive en services/markitdown-service/Makefile
  # ("make build"). Requiere "docker login registry.home.arpa" una vez en
  # este nodo (docs/05-instalacion-retaco.md, sección 5.3) antes del primer
  # "docker compose pull"/"up -d".
  # ---------------------------------------------------------------------------
  markitdown-service:
    image: registry.home.arpa/markitdown-service:latest
    container_name: markitdown-service
    restart: unless-stopped
    environment:
      MARKITDOWN_PORT: ${MARKITDOWN_PORT:-8001}
      MARKITDOWN_LOG_LEVEL: ${MARKITDOWN_LOG_LEVEL:-INFO}
    volumes:
      - /srv/homelab/pi-utils/markitdown/cache:/tmp/markitdown-cache
    ports:
      - "8001:8001"
    networks:
      - pi-utils-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # crawl4ai-scraper-service — Scraping y limpieza de contenido web a Markdown
  # (Crawl4AI + Playwright + FastAPI). Imagen del registry privado del clúster
  # (registry.home.arpa), NO se construye aquí — build/push vive en
  # services/crawl4ai-scraper-service/Makefile ("make build"). Requiere
  # "docker login registry.home.arpa" una vez en este nodo (docs/05-instalacion-retaco.md,
  # sección 5.3) antes del primer "docker compose pull"/"up -d".
  # Puerto host 8002 (no 8001, ya usado por markitdown-service) — el propio
  # contenedor escucha siempre en 8000 (fijo en su Dockerfile, no configurable
  # por env var). El contenedor necesita lanzar un Chromium real en el
  # lifespan al arrancar — start_period más generoso que el resto de
  # servicios "ligeros" de este nodo, ver docs/10-instalacion-pi4-utils.md.
  # Variables ANTI-BOT (ENABLE_STEALTH_MODE/UNDETECTED_BROWSER/MAGIC_MODE) a
  # propósito ACTIVADAS por defecto en este nodo (CRAWL4AI_ENABLE_*=true en
  # .env) — decisión explícita, no el default "false" del propio servicio.
  # ---------------------------------------------------------------------------
  crawl4ai-scraper-service:
    image: registry.home.arpa/crawl4ai-scraper-service:latest
    container_name: crawl4ai-scraper-service
    restart: unless-stopped
    environment:
      APP_NAME: ${CRAWL4AI_APP_NAME:-Crawl4AI Scraper Service}
      APP_ENV: ${CRAWL4AI_APP_ENV:-production}
      DEBUG: ${CRAWL4AI_DEBUG:-false}
      LOG_LEVEL: ${CRAWL4AI_LOG_LEVEL:-INFO}
      LOG_FORMAT: ${CRAWL4AI_LOG_FORMAT:-json}
      MAX_CONCURRENT_SCRAPES: ${CRAWL4AI_MAX_CONCURRENT_SCRAPES:-12}
      MAX_CONCURRENT_DEDICATED_BROWSERS: ${CRAWL4AI_MAX_CONCURRENT_DEDICATED_BROWSERS:-2}
      SCRAPE_TIMEOUT_SECONDS: ${CRAWL4AI_SCRAPE_TIMEOUT_SECONDS:-60}
      SEMAPHORE_ACQUIRE_TIMEOUT_SECONDS: ${CRAWL4AI_SEMAPHORE_ACQUIRE_TIMEOUT_SECONDS:-90}
      CRAWLER_HEADLESS: ${CRAWL4AI_CRAWLER_HEADLESS:-true}
      CRAWLER_VERBOSE: ${CRAWL4AI_CRAWLER_VERBOSE:-false}
      CRAWLER_PAGE_TIMEOUT_MS: ${CRAWL4AI_CRAWLER_PAGE_TIMEOUT_MS:-60000}
      CRAWLER_WAIT_UNTIL: ${CRAWL4AI_CRAWLER_WAIT_UNTIL:-domcontentloaded}
      ENABLE_STEALTH_MODE: ${CRAWL4AI_ENABLE_STEALTH_MODE:-false}
      ENABLE_UNDETECTED_BROWSER: ${CRAWL4AI_ENABLE_UNDETECTED_BROWSER:-false}
      ENABLE_MAGIC_MODE: ${CRAWL4AI_ENABLE_MAGIC_MODE:-false}
      ENABLE_PROXY: ${CRAWL4AI_ENABLE_PROXY:-false}
      PROXY_SERVER: ${CRAWL4AI_PROXY_SERVER:-}
      PROXY_USERNAME: ${CRAWL4AI_PROXY_USERNAME:-}
      PROXY_PASSWORD: ${CRAWL4AI_PROXY_PASSWORD:-}
      MAX_RETRIES: ${CRAWL4AI_MAX_RETRIES:-2}
      MARKDOWN_WORD_COUNT_THRESHOLD: ${CRAWL4AI_MARKDOWN_WORD_COUNT_THRESHOLD:-10}
    ports:
      - "8002:8000"
    networks:
      - pi-utils-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # n8n-aux — Instancia secundaria de n8n para flujos de utilidades
  # Usa SQLite (no requiere PostgreSQL en este nodo)
  # ---------------------------------------------------------------------------
  n8n-aux:
    image: n8nio/n8n:latest
    container_name: n8n-aux
    restart: unless-stopped
    environment:
      DB_TYPE: sqlite
      DB_SQLITE_VACUUM_ON_STARTUP: "true"
      N8N_ENCRYPTION_KEY: ${N8N_AUX_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_AUX_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_AUX_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_AUX_BASIC_AUTH_PASSWORD}
      N8N_HOST: ${N8N_AUX_HOST:-n8n-aux.home.arpa}
      N8N_PORT: ${N8N_AUX_PORT:-5679}
      N8N_PROTOCOL: ${N8N_AUX_PROTOCOL:-https}
      WEBHOOK_URL: ${N8N_AUX_WEBHOOK_URL:-https://n8n-aux.home.arpa/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Madrid}
      N8N_LOG_LEVEL: info
      # El Task Broker interno de n8n usa por defecto el puerto 5679, el mismo
      # que N8N_PORT en este nodo (elegido para no chocar con el n8n
      # principal, que usa 5678) — sin esto, n8n-aux entra en bucle de
      # reinicio ("Task Broker's port 5679 is already in use").
      N8N_RUNNERS_BROKER_PORT: "5680"
    volumes:
      - /srv/homelab/pi-utils/n8n-aux/data:/home/node/.n8n
    ports:
      - "5679:5679"
    networks:
      - pi-utils-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5679/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # node-exporter — Métricas del sistema host, scrapeadas por Prometheus en pi-obs
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: node-exporter
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - pi-utils-net
    pid: host

  # ---------------------------------------------------------------------------
  # cadvisor — Métricas de contenedores Docker, scrapeadas por Prometheus en pi-obs
  # ---------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks:
      - pi-utils-net
    privileged: true
    devices:
      - /dev/kmsg

  # ---------------------------------------------------------------------------
  # vaultwarden — Gestor de contraseñas (servidor compatible Bitwarden).
  # SQLite local, autocontenido en este nodo — sin dependencia de otros nodos
  # ni de exponer ninguna base de datos a la LAN. Ver docs/10-instalacion-pi4-utils.md
  # para instalación, uso y estrategia de backup (es el servicio más crítico
  # del clúster en cuanto a pérdida de datos).
  # ---------------------------------------------------------------------------
  vaultwarden:
    image: vaultwarden/server:1.37.0
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: https://vaultwarden.home.arpa
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      WEBSOCKET_ENABLED: "true"
      LOG_LEVEL: warn
    volumes:
      - /srv/homelab/pi-utils/vaultwarden/data:/data
    ports:
      - "8222:80"
    networks:
      - pi-utils-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/alive || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # portainer — Panel de administración de Docker para todo el clúster.
  # Servidor único (este nodo); se conecta a un portainer-agent en cada nodo
  # (incluido este mismo) para tener visión y control de todos los contenedores.
  # UI servida en HTTP interno (9000); TLS lo pone nginx en pi-dns.
  # Ver docs/10-instalacion-pi4-utils.md.
  # ---------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:2.42.0
    container_name: portainer
    restart: unless-stopped
    command: ["--http-enabled"]
    volumes:
      - /srv/homelab/pi-utils/portainer/data:/data
    ports:
      - "9000:9000"
    networks:
      - pi-utils-net
    # Sin healthcheck: la imagen portainer-ce no trae ni wget ni siquiera
    # /bin/sh (nada ejecutable salvo el propio binario /portainer) — un
    # healthcheck no puede ejecutarse ahí dentro, se quedaría "unhealthy"
    # para siempre aunque el servicio esté sano (mismo caso que
    # otel-collector en pi-obs). Nada depende de su estado "healthy": los
    # agentes se conectan hacia el servidor, no al revés.

  # ---------------------------------------------------------------------------
  # portainer-agent — Expone el Docker de ESTE nodo a Portainer (puerto 9001).
  # Igual que en el resto de nodos: uno por host, todos gestionados desde el
  # servidor de arriba.
  # ---------------------------------------------------------------------------
  portainer-agent:
    image: portainer/agent:2.42.0
    container_name: portainer-agent
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      AGENT_CLUSTER_ADDR: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - "9001:9001"
    networks:
      - pi-utils-net

  # ---------------------------------------------------------------------------
  # watchtower — Auto-actualiza SOLO los contenedores con la label
  # com.centurylinklabs.watchtower.enable=true (node-exporter, cadvisor,
  # portainer-agent) — servicios sin estado. vaultwarden, portainer, n8n-aux,
  # rsshub y markitdown-service NUNCA se auto-actualizan — ver
  # docs/16-mantenimiento-actualizaciones.md.
  # ---------------------------------------------------------------------------
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pi-utils-net

networks:
  pi-utils-net:
    name: pi-utils-net
    driver: bridge
