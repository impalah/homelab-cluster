name: homelab-pi-utils

# =============================================================================
# Stack del nodo pi-utils (192.168.1.173)
# Servicios activos: portainer (servidor), watchtower
# (rsshub, n8n-aux, markitdown-service, crawl4ai-scraper-service,
# capataz-api/capataz-runner/capataz-frontend, node-exporter/cadvisor y
# portainer-agent migrados al swarm, Fase 1-4 de docs/31-docker-swarm.md —
# ver docker-swarm/stacks/)
# =============================================================================

# capataz-api / capataz-runner / capataz-frontend -- MIGRADOS al swarm
# (Fase 4, docs/31-docker-swarm.md, 2026-08-27). Fuente de verdad ahora:
# docker-swarm/stacks/capataz/docker-compose.yml (stack combinado, los
# tres pinnados con node.hostname==pi-utils). El anchor x-capataz-env que
# vivía aquí ya no se usa -- cada servicio migrado lleva su propio bloque
# de environment: en el stack nuevo, con los valores reales tomados de
# este .env (no de los defaults del anchor).

# Logs -> driver `loki` nativo de Docker en vez de Promtail (docs/31-docker-swarm.md,
# Fase 1) -- plugin arm64 oficial (grafana/loki-docker-driver:3.7.2-arm64), no
# ":latest" (no es un manifest multi-arch real, resuelve a x86_64 en Raspberry Pi).
x-logging: &loki-logging
  driver: loki
  options:
    loki-url: "http://192.168.1.171:3100/loki/api/v1/push"
    loki-external-labels: "node=pi-utils"
    mode: non-blocking
    max-buffer-size: 4m

services:

  # ---------------------------------------------------------------------------
  # rsshub — Agregador RSS/Atom universal
  #
  # Migrado a Infisical (mejora 28, docs/22-mejoras-futuras.md) — mismo patrón
  # que el resto. ACCESS_KEY ya no viene de ${...} (el .env real ya no lo
  # tiene) — lo inyecta "infisical run" (secreto renombrado de
  # RSSHUB_ACCESS_KEY a ACCESS_KEY en Infisical para que coincida con lo que
  # RSSHub espera de verdad). Entrypoint real de la imagen "dumb-init --
  # npm run start" (confirmado con docker inspect).
  #
  # ⚠️ El healthcheck ya NO puede referenciar "$$ACCESS_KEY" como antes: ese
  # valor solo existe en el entorno del proceso arrancado por "infisical run"
  # (PID 1), no en el entorno "estático" del contenedor que ve un "docker
  # exec" del healthcheck — confirmado al migrar este servicio, hubiera dado
  # 403 constante con la key siempre vacía. Se acepta 200 (sin key) o 403
  # (con key, rechazado por el exec sin ella) como "sano" — mismo criterio ya
  # usado en "registry" (retaco) para 401/200.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # rsshub -- MIGRADO al swarm (Fase 4, docs/31-docker-swarm.md, 2026-08-27).
  # Fuente de verdad ahora: docker-swarm/stacks/rsshub/docker-compose.yml,
  # constraints: node.hostname==pi-utils (bind-mounts de CA/infisical-cli
  # con ruta con forma de nodo, solo existen aquí). Bloque retirado a
  # propósito -- puerto 1200 ya reservado por la routing mesh del swarm.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # markitdown-service — MIGRADO al swarm (Fase 2, docs/31-docker-swarm.md,
  # 2026-08-24). Fuente de verdad ahora: docker-swarm/stacks/markitdown/
  # docker-compose.yml, sin constraints (cualquiera de los 5 nodos del
  # swarm). Bloque retirado a propósito (no solo el contenedor parado) —
  # dejarlo sin más resucitaría el mismo choque de puerto visto en vivo con
  # Traefik/capataz-frontend y con registry (Fase 4) si alguien lanza un
  # `docker compose up -d` a secas en este nodo: la routing mesh de Swarm ya
  # tiene el 8001 reservado en todos los nodos del swarm, este incluido.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # crawl4ai-scraper-service -- MIGRADO al swarm (Fase 4, docs/31-docker-swarm.md,
  # 2026-08-27). Fuente de verdad ahora: docker-swarm/stacks/
  # crawl4ai-scraper-service/docker-compose.yml, sin constraints (sin
  # estado real, ni un solo volumen) -- puede aterrizar en cualquiera de
  # los 5 nodos del swarm. mem_limit convertido a
  # deploy.resources.limits.memory (ver docs/31). Bloque retirado a
  # propósito -- puerto 8002 ya reservado por la routing mesh del swarm.
  # ---------------------------------------------------------------------------


  # ---------------------------------------------------------------------------
  # n8n-aux — MIGRADO al swarm (Fase 4, docs/31-docker-swarm.md, 2026-08-27).
  # Fuente de verdad ahora: docker-swarm/stacks/n8n-aux/docker-compose.yml,
  # pinnado con `node.hostname==pi-utils` -- mismos datos (SQLite propio),
  # sin mover. N8N_ENCRYPTION_KEY sigue viniendo de Infisical exactamente
  # igual, la migración de orquestador no la toca. Bloque retirado a
  # propósito (no solo el contenedor parado), mismo motivo que
  # registry/qdrant/n8n-main.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # capataz-api / capataz-runner / capataz-frontend -- MIGRADOS al swarm
  # (Fase 4, docs/31-docker-swarm.md, 2026-08-27). Fuente de verdad ahora:
  # docker-swarm/stacks/capataz/docker-compose.yml, los tres pinnados con
  # node.hostname==pi-utils -- catalog/alembic/certs/config solo existen en
  # este nodo. Secrets nativos de Compose (./capataz/secrets/*) convertidos
  # a objetos docker secret reales (capataz-*-v1). Bloque retirado a
  # propósito -- puertos 8000/8090 ya reservados por la routing mesh del
  # swarm (mode: host).
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # node-exporter / cadvisor — migrados a Docker Swarm (mode: global),
  # docker-swarm/stacks/common/docker-compose.yml — ver docs/31-docker-swarm.md.
  # Ya no se despliegan aquí; Prometheus (pi-obs) los sigue scrapeando por la
  # misma IP:puerto que antes, sin cambios en su configuración.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # vaultwarden — MIGRADO al swarm (Fase 4, docs/31-docker-swarm.md,
  # 2026-08-27). Fuente de verdad ahora:
  # docker-swarm/stacks/vaultwarden/docker-compose.yml, pinnado con
  # `node.hostname==pi-utils` -- mismos datos, sin mover. Backup obligatorio
  # ejecutado antes de migrar (shared/scripts/backup-vaultwarden.sh). Bloque
  # retirado a propósito (no solo el contenedor parado), mismo motivo que el
  # resto de servicios migrados en esta fase.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # portainer -- MIGRADO al swarm (Fase 4, docs/31-docker-swarm.md,
  # 2026-08-27). Fuente de verdad ahora:
  # docker-swarm/stacks/portainer-server/docker-compose.yml, pinnado con
  # node.hostname==pi-utils -- BoltDB real (3.1M), sin mover. Backup físico
  # ejecutado antes de migrar. Bloque retirado a propósito -- último
  # servicio Compose clásico de este nodo (junto con watchtower, que NUNCA
  # se migra).
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # portainer-agent — migrado a Docker Swarm (mode: global, patrón oficial
  # agent-stack.yml), docker-swarm/stacks/portainer/ — ver docs/31-docker-swarm.md.
  # Ya no se despliega aquí.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # watchtower — Auto-actualiza SOLO los contenedores con la label
  # com.centurylinklabs.watchtower.enable=true — hoy ningún servicio de este
  # nodo la lleva. node-exporter/cadvisor/portainer-agent/promtail ya no
  # están aquí (migrados a Swarm/driver loki, ver arriba); vaultwarden,
  # portainer, n8n-aux, rsshub y markitdown-service NUNCA se auto-actualizan
  # — ver docs/16-mantenimiento-actualizaciones.md.
  # ---------------------------------------------------------------------------
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    logging: *loki-logging
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pi-utils-net

  # ---------------------------------------------------------------------------
  # promtail — migrado al driver de logging `loki` nativo de Docker (ver
  # x-logging arriba) — docs/31-docker-swarm.md. Ya no se despliega aquí.
  # ---------------------------------------------------------------------------

networks:
  pi-utils-net:
    name: pi-utils-net
    driver: bridge
# agent_network (portainer-agent_agent_network) y el bloque "secrets:" con
# los 7 ficheros de Capataz retirados -- únicos consumidores eran
# portainer/capataz-*, ambos migrados al swarm (ver arriba). Los secrets
# ahora son objetos `docker secret` reales (capataz-*-v1); los ficheros
# originales bajo /srv/homelab/pi-utils/capataz/secrets/ siguen ahí sin
# tocar (fuente usada para crearlos), pero este compose ya no los referencia.
