name: homelab-pi-utils

# =============================================================================
# Stack del nodo pi-utils (192.168.1.173)
# Servicios: rsshub, markitdown-service (build local), n8n-aux, capataz-api,
# capataz-runner, capataz-frontend
# =============================================================================

# ---------------------------------------------------------------------------
# capataz-api / capataz-runner — Consola de estado y automatización del
# clúster (repo propio, NO parte de este monorepo:
# github.com/impalah/capataz). Sustituye al panel estático que antes ocupaba
# index.home.arpa (nginx en pi-dns, ver docs/28-capataz-consola-automatizacion.md).
#
# Imágenes publicadas en el registry privado del clúster (registry.home.arpa),
# igual que apikey-service/markitdown-service/whisper-service — build/push
# multi-arch (linux/amd64,linux/arm64: este nodo es arm64) vive en el propio
# repo de Capataz (api/Makefile, runner/Makefile — "make build" en cada uno),
# NO en services/ de este monorepo, porque Capataz es un repositorio externo
# (github.com/impalah/capataz) con su propio ciclo de vida. Este nodo solo
# hace pull — ver docs/28-capataz-consola-automatizacion.md para el
# procedimiento de actualización.
#
# catalog/, api/alembic.ini, api/alembic/ y certs/ (bind-mounts más abajo) SÍ
# siguen viniendo de un checkout parcial del repo Capataz en
# /srv/homelab/pi-utils/capataz/ — no se empaquetan en la imagen (el propio
# Dockerfile de Capataz no los COPYa), así que ese checkout sigue haciendo
# falta aunque ya no se construya nada localmente.
#
# Postgres/Redis: NO se despliegan los "postgres"/"redis" propios del
# docker-compose.yml de Capataz (pensados para su quickstart standalone) —
# api/runner apuntan a la infraestructura ya compartida del clúster
# (postgres-main y valkey, ambos en retaco), vía los secrets database_url/
# redis_url de abajo.
#
# Secrets: Capataz lee sus credenciales sensibles (DSN de Postgres/Redis,
# token de Portainer, clave SSH del runner...) de ficheros bajo
# /run/secrets/<nombre> (Compose "secrets:", no Swarm — funciona igual con
# "docker compose" normal), NUNCA de variables de entorno — así lo exige su
# propio código (capataz_api/infrastructure/secrets/file_secret_reader.py,
# capataz_runner/config.py). Por eso este stack combina el patrón habitual
# de este repo (config no sensible en .env) con "secrets:" para lo sensible,
# en vez de todo por variables de entorno como el resto de servicios de este
# fichero.
# ---------------------------------------------------------------------------
x-capataz-env: &capataz-env
  CAPATAZ_ENV: ${CAPATAZ_ENV:-development}
  CAPATAZ_LOG_LEVEL: ${CAPATAZ_LOG_LEVEL:-INFO}
  CAPATAZ_LOG_JSON: ${CAPATAZ_LOG_JSON:-false}
  CAPATAZ_API_HOST: ${CAPATAZ_API_HOST:-0.0.0.0}
  CAPATAZ_API_PORT: ${CAPATAZ_API_PORT:-8000}
  CAPATAZ_CORS_ORIGINS: ${CAPATAZ_CORS_ORIGINS:-https://index.home.arpa}
  CAPATAZ_CELERY_QUEUE: ${CAPATAZ_CELERY_QUEUE:-automation}
  CAPATAZ_CELERY_CONCURRENCY: ${CAPATAZ_CELERY_CONCURRENCY:-2}
  CAPATAZ_PORTAINER_URL: ${CAPATAZ_PORTAINER_URL:-https://portainer.home.arpa}
  CAPATAZ_GRAFANA_URL: ${CAPATAZ_GRAFANA_URL:-https://grafana.home.arpa}
  CAPATAZ_PROMETHEUS_URL: ${CAPATAZ_PROMETHEUS_URL:-https://prometheus.home.arpa}
  # CAPATAZ_LOKI_URL deliberadamente AUSENTE de este bloque (no ",: ${...:-}"
  # con default vacío): el campo es `AnyHttpUrl | None` en el código de
  # Capataz — con la clave presente pero vacía, Pydantic intenta parsear ""
  # como URL y el arranque falla (visto en real: "Input should be a valid
  # URL, input is empty"). Solo con la variable de entorno TOTALMENTE
  # ausente cae al default None del propio código. loki.home.arpa no está
  # expuesto en este clúster (se consulta vía Grafana) — si se quiere
  # enlazar Loki en el futuro, añadir aquí con una URL real, no vacía.
  CAPATAZ_COGNITO_REGION: ${CAPATAZ_COGNITO_REGION:-eu-west-1}
  CAPATAZ_COGNITO_USER_POOL_ID: ${CAPATAZ_COGNITO_USER_POOL_ID:-}
  CAPATAZ_COGNITO_APP_CLIENT_ID: ${CAPATAZ_COGNITO_APP_CLIENT_ID:-}
  CAPATAZ_OIDC_ISSUER: ${CAPATAZ_OIDC_ISSUER:-}
  CAPATAZ_OIDC_AUDIENCE: ${CAPATAZ_OIDC_AUDIENCE:-}
  CAPATAZ_OIDC_JWKS_URI: ${CAPATAZ_OIDC_JWKS_URI:-}
  CAPATAZ_OIDC_GROUPS_CLAIM: ${CAPATAZ_OIDC_GROUPS_CLAIM:-groups}
  CAPATAZ_AUTH_MODE: ${CAPATAZ_AUTH_MODE:-dev_mock}
  CAPATAZ_INITIAL_CATALOG_YAML_PATH: ${CAPATAZ_INITIAL_CATALOG_YAML_PATH:-/app/catalog/services.example.yaml}
  CAPATAZ_HTTP_TIMEOUT_SECONDS: ${CAPATAZ_HTTP_TIMEOUT_SECONDS:-5}
  CAPATAZ_HEALTH_ALLOWED_HOST_SUFFIXES: ${CAPATAZ_HEALTH_ALLOWED_HOST_SUFFIXES:-.home.arpa}
  CAPATAZ_STATUS_CACHE_TTL_SECONDS: ${CAPATAZ_STATUS_CACHE_TTL_SECONDS:-30}
  # CA interna del clúster — necesaria para que httpx (Portainer/Grafana/
  # Prometheus) y el cliente Redis (Valkey, TLS obligatorio) confíen en
  # certificados firmados por la CA de pi-dns. Generado con "make trust-ca"
  # dentro de /srv/homelab/pi-utils/capataz/ — ver docs/28.
  SSL_CERT_FILE: ${CAPATAZ_SSL_CERT_FILE:-/run/ca-certs/ca-bundle.pem}

services:

  # ---------------------------------------------------------------------------
  # rsshub — Agregador RSS/Atom universal
  #
  # Migrado a Infisical (mejora 28, docs/22-mejoras-futuras.md) — mismo patrón
  # que el resto. ACCESS_KEY ya no viene de ${...} (el .env real ya no lo
  # tiene) — lo inyecta "infisical run" (secreto renombrado de
  # RSSHUB_ACCESS_KEY a ACCESS_KEY en Infisical para que coincida con lo que
  # RSSHub espera de verdad). Entrypoint real de la imagen "dumb-init --
  # npm run start" (confirmado con docker inspect).
  #
  # ⚠️ El healthcheck ya NO puede referenciar "$$ACCESS_KEY" como antes: ese
  # valor solo existe en el entorno del proceso arrancado por "infisical run"
  # (PID 1), no en el entorno "estático" del contenedor que ve un "docker
  # exec" del healthcheck — confirmado al migrar este servicio, hubiera dado
  # 403 constante con la key siempre vacía. Se acepta 200 (sin key) o 403
  # (con key, rechazado por el exec sin ella) como "sano" — mismo criterio ya
  # usado en "registry" (retaco) para 401/200.
  # ---------------------------------------------------------------------------
  rsshub:
    image: diygod/rsshub:latest
    container_name: rsshub
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      CACHE_EXPIRE: ${RSSHUB_CACHE_EXPIRE:-300}
      PUPPETEER_WS_ENDPOINT: ""
      NO_LOGFILES: "true"
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${RSSHUB_INFISICAL_CLIENT_ID}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${RSSHUB_INFISICAL_CLIENT_SECRET}
      INFISICAL_PROJECT_ID: ${RSSHUB_INFISICAL_PROJECT_ID}
      INFISICAL_DOMAIN: https://infisical.home.arpa/api
      SSL_CERT_FILE: /etc/ssl/certs/homelab-ca.crt
    volumes:
      - /srv/homelab/pi-utils/rsshub/data:/app/data
      # CA interna del clúster, de solo lectura — necesaria para que el CLI de
      # Infisical (Go) confíe en infisical.home.arpa. Descargar antes del
      # primer arranque:
      #   curl -s http://192.168.1.170/ca.crt -o /srv/homelab/pi-utils/rsshub/ca/homelab-ca.crt
      - /srv/homelab/pi-utils/rsshub/ca/homelab-ca.crt:/etc/ssl/certs/homelab-ca.crt:ro
      - /srv/homelab/pi-utils/infisical-cli/infisical:/usr/local/bin/infisical:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        TOKEN=$$(infisical login --method=universal-auth \
          --client-id="$$INFISICAL_UNIVERSAL_AUTH_CLIENT_ID" \
          --client-secret="$$INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET" \
          --plain --silent) &&
        exec infisical run --token="$$TOKEN" --projectId="$$INFISICAL_PROJECT_ID" --env=prod --path=/rsshub/ -- \
          dumb-init -- npm run start
    ports:
      - "1200:1200"
    networks:
      - pi-utils-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:1200/healthz | grep -qE '^(200|403)$$' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # markitdown-service — Conversión de documentos a Markdown (FastAPI + uv)
  # Imagen del registry privado del clúster (registry.home.arpa), NO se
  # construye aquí — build/push vive en services/markitdown-service/Makefile
  # ("make build"). Requiere "docker login registry.home.arpa" una vez en
  # este nodo (docs/05-instalacion-retaco.md, sección 5.3) antes del primer
  # "docker compose pull"/"up -d".
  # ---------------------------------------------------------------------------
  markitdown-service:
    image: registry.home.arpa/markitdown-service:latest
    container_name: markitdown-service
    restart: unless-stopped
    environment:
      MARKITDOWN_PORT: ${MARKITDOWN_PORT:-8001}
      MARKITDOWN_LOG_LEVEL: ${MARKITDOWN_LOG_LEVEL:-INFO}
      MARKITDOWN_LOG_FORMAT: ${MARKITDOWN_LOG_FORMAT:-json}
    volumes:
      - /srv/homelab/pi-utils/markitdown/cache:/tmp/markitdown-cache
    ports:
      - "8001:8001"
    networks:
      - pi-utils-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # crawl4ai-scraper-service — Scraping y limpieza de contenido web a Markdown
  # (Crawl4AI + Playwright + FastAPI). Imagen del registry privado del clúster
  # (registry.home.arpa), NO se construye aquí — build/push vive en
  # services/crawl4ai-scraper-service/Makefile ("make build"). Requiere
  # "docker login registry.home.arpa" una vez en este nodo (docs/05-instalacion-retaco.md,
  # sección 5.3) antes del primer "docker compose pull"/"up -d".
  # Puerto host 8002 (no 8001, ya usado por markitdown-service) — el propio
  # contenedor escucha siempre en 8000 (fijo en su Dockerfile, no configurable
  # por env var). El contenedor necesita lanzar un Chromium real en el
  # lifespan al arrancar — start_period más generoso que el resto de
  # servicios "ligeros" de este nodo, ver docs/10-instalacion-pi4-utils.md.
  # Variables ANTI-BOT (ENABLE_STEALTH_MODE/UNDETECTED_BROWSER/MAGIC_MODE) a
  # propósito ACTIVADAS por defecto en este nodo (CRAWL4AI_ENABLE_*=true en
  # .env) — decisión explícita, no el default "false" del propio servicio.
  # ---------------------------------------------------------------------------
  crawl4ai-scraper-service:
    image: registry.home.arpa/crawl4ai-scraper-service:latest
    container_name: crawl4ai-scraper-service
    restart: unless-stopped
    # Límite de memoria como red de seguridad: el navegador compartido de
    # Crawl4AI puede acumular memoria bajo carga sostenida (visto en
    # producción: 452MB -> 5.7GB en ~1h, hasta tumbar la RAM de todo el
    # nodo pi-utils, no solo este contenedor). Con este límite, si vuelve a
    # ocurrir, Docker mata y reinicia (restart: unless-stopped) solo este
    # contenedor -- rsshub/markitdown-service/SSH del host quedan a salvo.
    # "mem_limit" (no "deploy.resources.limits"), que es sintaxis de Swarm y
    # "docker compose up" normal la ignora en silencio sin avisar de nada.
    mem_limit: 2g
    environment:
      APP_NAME: ${CRAWL4AI_APP_NAME:-Crawl4AI Scraper Service}
      APP_ENV: ${CRAWL4AI_APP_ENV:-production}
      DEBUG: ${CRAWL4AI_DEBUG:-false}
      LOG_LEVEL: ${CRAWL4AI_LOG_LEVEL:-INFO}
      LOG_FORMAT: ${CRAWL4AI_LOG_FORMAT:-json}
      MAX_CONCURRENT_SCRAPES: ${CRAWL4AI_MAX_CONCURRENT_SCRAPES:-12}
      MAX_CONCURRENT_DEDICATED_BROWSERS: ${CRAWL4AI_MAX_CONCURRENT_DEDICATED_BROWSERS:-2}
      SCRAPE_TIMEOUT_SECONDS: ${CRAWL4AI_SCRAPE_TIMEOUT_SECONDS:-60}
      # Por debajo del proxy_read_timeout de nginx para crawl4ai.scraper.home.arpa
      # (90s) a propósito: si son iguales, gana la carrera quien complete antes,
      # normalmente nginx -- el cliente ve un 504 genérico en vez del 503 propio
      # de la app (con mensaje claro de "límite de concurrencia agotado").
      SEMAPHORE_ACQUIRE_TIMEOUT_SECONDS: ${CRAWL4AI_SEMAPHORE_ACQUIRE_TIMEOUT_SECONDS:-75}
      CRAWLER_HEADLESS: ${CRAWL4AI_CRAWLER_HEADLESS:-true}
      CRAWLER_VERBOSE: ${CRAWL4AI_CRAWLER_VERBOSE:-false}
      CRAWLER_PAGE_TIMEOUT_MS: ${CRAWL4AI_CRAWLER_PAGE_TIMEOUT_MS:-60000}
      CRAWLER_WAIT_UNTIL: ${CRAWL4AI_CRAWLER_WAIT_UNTIL:-domcontentloaded}
      MAX_PAGES_BEFORE_RECYCLE: ${CRAWL4AI_MAX_PAGES_BEFORE_RECYCLE:-15}
      ENABLE_STEALTH_MODE: ${CRAWL4AI_ENABLE_STEALTH_MODE:-false}
      ENABLE_UNDETECTED_BROWSER: ${CRAWL4AI_ENABLE_UNDETECTED_BROWSER:-false}
      ENABLE_MAGIC_MODE: ${CRAWL4AI_ENABLE_MAGIC_MODE:-false}
      ENABLE_PROXY: ${CRAWL4AI_ENABLE_PROXY:-false}
      PROXY_SERVER: ${CRAWL4AI_PROXY_SERVER:-}
      PROXY_USERNAME: ${CRAWL4AI_PROXY_USERNAME:-}
      PROXY_PASSWORD: ${CRAWL4AI_PROXY_PASSWORD:-}
      MAX_RETRIES: ${CRAWL4AI_MAX_RETRIES:-2}
      MARKDOWN_WORD_COUNT_THRESHOLD: ${CRAWL4AI_MARKDOWN_WORD_COUNT_THRESHOLD:-10}
    ports:
      - "8002:8000"
    networks:
      - pi-utils-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # n8n-aux — Instancia secundaria de n8n para flujos de utilidades
  # Usa SQLite (no requiere PostgreSQL en este nodo)
  #
  # Migrado a Infisical (mejora 28, docs/22-mejoras-futuras.md) — mismo patrón
  # que n8n-main/apikey-service. N8N_ENCRYPTION_KEY/N8N_BASIC_AUTH_USER/
  # N8N_BASIC_AUTH_PASSWORD ya no vienen de ${...} — los inyecta "infisical
  # run" con esos mismos nombres, tras renombrar en Infisical las claves
  # importadas en bloque el 2026-08-10 (N8N_AUX_ENCRYPTION_KEY ->
  # N8N_ENCRYPTION_KEY, N8N_AUX_BASIC_AUTH_USER -> N8N_BASIC_AUTH_USER,
  # N8N_AUX_BASIC_AUTH_PASSWORD -> N8N_BASIC_AUTH_PASSWORD) para que
  # coincidan con lo que n8n espera de verdad.
  # ---------------------------------------------------------------------------
  n8n-aux:
    image: n8nio/n8n:latest
    container_name: n8n-aux
    restart: unless-stopped
    environment:
      DB_TYPE: sqlite
      DB_SQLITE_VACUUM_ON_STARTUP: "true"
      N8N_BASIC_AUTH_ACTIVE: ${N8N_AUX_BASIC_AUTH_ACTIVE:-true}
      N8N_HOST: ${N8N_AUX_HOST:-n8n-aux.home.arpa}
      N8N_PORT: ${N8N_AUX_PORT:-5679}
      N8N_PROTOCOL: ${N8N_AUX_PROTOCOL:-https}
      N8N_WEBHOOK_URL: ${N8N_AUX_WEBHOOK_URL:-https://n8n-aux.home.arpa/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Madrid}
      N8N_LOG_LEVEL: info
      # El Task Broker interno de n8n usa por defecto el puerto 5679, el mismo
      # que N8N_PORT en este nodo (elegido para no chocar con el n8n
      # principal, que usa 5678) — sin esto, n8n-aux entra en bucle de
      # reinicio ("Task Broker's port 5679 is already in use").
      N8N_RUNNERS_BROKER_PORT: "5680"
      # Mismo motivo que n8n-main (retaco/docker-compose.yml) — ver ese
      # fichero para el detalle de cada variable.
      N8N_PROXY_HOPS: "1"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "true"
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "2147483648"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "5000"
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${N8N_AUX_INFISICAL_CLIENT_ID}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${N8N_AUX_INFISICAL_CLIENT_SECRET}
      INFISICAL_PROJECT_ID: ${N8N_AUX_INFISICAL_PROJECT_ID}
      INFISICAL_DOMAIN: https://infisical.home.arpa/api
      SSL_CERT_FILE: /etc/ssl/certs/homelab-ca.crt
    volumes:
      - /srv/homelab/pi-utils/n8n-aux/data:/home/node/.n8n
      # CA interna del clúster, de solo lectura — necesaria para que el CLI de
      # Infisical (Go) confíe en infisical.home.arpa. Descargar antes del
      # primer arranque:
      #   curl -s http://192.168.1.170/ca.crt -o /srv/homelab/pi-utils/n8n-aux/ca/homelab-ca.crt
      - /srv/homelab/pi-utils/n8n-aux/ca/homelab-ca.crt:/etc/ssl/certs/homelab-ca.crt:ro
      - /srv/homelab/pi-utils/infisical-cli/infisical:/usr/local/bin/infisical:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        TOKEN=$$(infisical login --method=universal-auth \
          --client-id="$$INFISICAL_UNIVERSAL_AUTH_CLIENT_ID" \
          --client-secret="$$INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET" \
          --plain --silent) &&
        exec infisical run --token="$$TOKEN" --projectId="$$INFISICAL_PROJECT_ID" --env=prod --path=/n8n-aux/ -- \
          tini -- /docker-entrypoint.sh
    ports:
      - "5679:5679"
    networks:
      - pi-utils-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5679/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # capataz-api — FastAPI. Migraciones Alembic antes de arrancar Uvicorn (el
  # Dockerfile no las empaqueta ejecutadas; hace falta correrlas en cada
  # arranque). Importa el catálogo YAML de forma idempotente al iniciar.
  # ---------------------------------------------------------------------------
  capataz-api:
    # Imagen del registry privado del clúster (registry.home.arpa), NO se
    # construye aquí — build/push multi-arch (linux/amd64,linux/arm64,
    # necesario: este nodo es arm64) vive en el propio repo de Capataz
    # (api/Makefile "make build"), no en services/ de este repo — ver
    # docs/28-capataz-consola-automatizacion.md. Requiere
    # "docker login registry.home.arpa" una vez en este nodo antes del
    # primer "docker compose pull"/"up -d".
    image: registry.home.arpa/capataz-api:latest
    container_name: capataz-api
    restart: unless-stopped
    environment: *capataz-env
    volumes:
      - ./capataz/catalog:/app/catalog:ro
      - ./capataz/api/alembic.ini:/app/alembic.ini:ro
      - ./capataz/api/alembic:/app/alembic:ro
      - ./capataz/certs:/run/ca-certs:ro
    secrets:
      - database_url
      - redis_url
      - portainer_token
      - cognito_client_secret
    ports:
      - "8000:8000"
    networks:
      - pi-utils-net
    command:
      - /bin/sh
      - -ec
      - >-
        alembic upgrade head &&
        exec uvicorn capataz_api.main:app --host 0.0.0.0 --port 8000
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # capataz-runner — Celery worker (+beat embebido) que ejecuta las acciones
  # allow-listed (Portainer/Ansible) encoladas por capataz-api. Necesita
  # cliente SSH (ya en su imagen) y la cuenta dedicada "capataz_automation"
  # autorizada en los nodos del clúster — ver docs/28.
  # ---------------------------------------------------------------------------
  capataz-runner:
    # Imagen del registry privado del clúster — mismo criterio que
    # capataz-api justo arriba, ver ese comentario.
    image: registry.home.arpa/capataz-runner:latest
    container_name: capataz-runner
    restart: unless-stopped
    environment: *capataz-env
    volumes:
      - ./capataz/certs:/run/ca-certs:ro
    secrets:
      - database_url
      - redis_url
      - portainer_token
      - runner_ssh_private_key
      - runner_known_hosts
      - ansible_vault_password
    networks:
      - pi-utils-net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /home/capataz/.ansible/tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "celery -A capataz_runner.celery_app:app inspect ping --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  # ---------------------------------------------------------------------------
  # capataz-frontend — Frontend de Capataz (SPA), servido por el contenedor
  # nginx propio del repo de Capataz (frontend/Dockerfile), en vez del build
  # estático desplegado a mano en pi-dns hasta ahora (ver docs/28). A partir
  # de este cambio, pi-dns pasa a ser proxy puro para index.home.arpa/
  # home.404labo.net — ver pi-dns/config/nginx/nginx.conf y docs/28.
  #
  # Config en tiempo de ejecución (CAPATAZ_FRONTEND_*) renderizada por el
  # propio /docker-entrypoint.d/40-render-runtime-config.sh de la imagen en
  # cada arranque (envsubst) — ya no hace falta re-renderizar config.js a
  # mano tras cada cambio, a diferencia del despliegue estático anterior.
  # Mismos valores que ya estaban en vivo en /srv/homelab/pi-dns/nginx/
  # capataz-html/config.js (login real vía Authentik, ver docs/28 "Estado
  # actual — login real con Authentik").
  #
  # frontend/nginx/default.conf (horneado en la imagen) trae un
  # "proxy_pass http://api:8000;" fijo para /api/ — sobreescrito con un
  # bind-mount propio (pi-utils/config/capataz-frontend/default.conf) que
  # reenvía a "https://capataz-api.home.arpa" en vez de un alias de red
  # Docker: mismo patrón que ya usa el propio capataz-api para referenciar
  # otros servicios del clúster (CAPATAZ_PORTAINER_URL, CAPATAZ_GRAFANA_URL...),
  # y robusto de cara a Swarm (routing mesh) si capataz-api/capataz-frontend
  # acaban en nodos distintos — ver comentario completo en ese fichero.
  # ---------------------------------------------------------------------------
  capataz-frontend:
    # Imagen del registry privado del clúster (registry.home.arpa), NO se
    # construye aquí — build/push multi-arch (linux/amd64,linux/arm64,
    # necesario: este nodo es arm64) vive en frontend/Makefile del propio
    # repo de Capataz ("make docker-build"), igual que capataz-api/capataz-runner.
    image: registry.home.arpa/capataz-frontend:latest
    container_name: capataz-frontend
    restart: unless-stopped
    environment:
      CAPATAZ_FRONTEND_API_BASE_URL: /api/v1
      CAPATAZ_FRONTEND_USE_MSW: "false"
      CAPATAZ_FRONTEND_DEV_USER: ""
      CAPATAZ_FRONTEND_OIDC_ISSUER: https://authentik.home.arpa/application/o/capataz/
      CAPATAZ_FRONTEND_OIDC_CLIENT_ID: capataz
      CAPATAZ_FRONTEND_OIDC_SCOPE: openid profile email groups
    volumes:
      - ./config/capataz-frontend/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    networks:
      - pi-utils-net
    depends_on:
      capataz-api:
        condition: service_healthy
    # Mismo endurecimiento que trae el docker-compose.yml standalone del
    # propio repo de Capataz (frontend/docker-compose.yml) — filesystem
    # de solo lectura salvo el tmpfs que necesita el propio nginx y el
    # config.js renderizado en tiempo de arranque.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=8m
      - /config-runtime:rw,noexec,nosuid,size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # node-exporter — Métricas del sistema host, scrapeadas por Prometheus en pi-obs
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: node-exporter
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - pi-utils-net
    pid: host

  # ---------------------------------------------------------------------------
  # cadvisor — Métricas de contenedores Docker, scrapeadas por Prometheus en pi-obs
  # ---------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    restart: unless-stopped
    command:
      - "-disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp,disk,diskIO"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks:
      - pi-utils-net
    privileged: true
    cgroup: host
    devices:
      - /dev/kmsg

  # ---------------------------------------------------------------------------
  # vaultwarden — Gestor de contraseñas (servidor compatible Bitwarden).
  # SQLite local, autocontenido en este nodo — sin dependencia de otros nodos
  # ni de exponer ninguna base de datos a la LAN. Ver docs/10-instalacion-pi4-utils.md
  # para instalación, uso y estrategia de backup (es el servicio más crítico
  # del clúster en cuanto a pérdida de datos).
  #
  # Migrado a Infisical (mejora 28, docs/22-mejoras-futuras.md) — mismo patrón
  # que el resto. ADMIN_TOKEN ya no viene de ${...} — lo inyecta "infisical
  # run" (secreto renombrado de VAULTWARDEN_ADMIN_TOKEN a ADMIN_TOKEN en
  # Infisical). Confirmado que se compara en cada petición a /admin, no se
  # siembra solo una vez — candidato limpio para este mecanismo. Entrypoint
  # real de la imagen "/start.sh" (Entrypoint vacío, confirmado con docker
  # inspect) — el wrapper reemplaza el entrypoint entero.
  # ---------------------------------------------------------------------------
  vaultwarden:
    image: vaultwarden/server:1.37.0
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: https://vaultwarden.home.arpa
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      WEBSOCKET_ENABLED: "true"
      LOG_LEVEL: warn
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${VAULTWARDEN_INFISICAL_CLIENT_ID}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${VAULTWARDEN_INFISICAL_CLIENT_SECRET}
      INFISICAL_PROJECT_ID: ${VAULTWARDEN_INFISICAL_PROJECT_ID}
      INFISICAL_DOMAIN: https://infisical.home.arpa/api
      SSL_CERT_FILE: /etc/ssl/certs/homelab-ca.crt
    volumes:
      - /srv/homelab/pi-utils/vaultwarden/data:/data
      # CA interna del clúster, de solo lectura — necesaria para que el CLI de
      # Infisical (Go) confíe en infisical.home.arpa. Descargar antes del
      # primer arranque:
      #   curl -s http://192.168.1.170/ca.crt -o /srv/homelab/pi-utils/vaultwarden/ca/homelab-ca.crt
      - /srv/homelab/pi-utils/vaultwarden/ca/homelab-ca.crt:/etc/ssl/certs/homelab-ca.crt:ro
      - /srv/homelab/pi-utils/infisical-cli/infisical:/usr/local/bin/infisical:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        TOKEN=$$(infisical login --method=universal-auth \
          --client-id="$$INFISICAL_UNIVERSAL_AUTH_CLIENT_ID" \
          --client-secret="$$INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET" \
          --plain --silent) &&
        exec infisical run --token="$$TOKEN" --projectId="$$INFISICAL_PROJECT_ID" --env=prod --path=/vaultwarden/ -- \
          /start.sh
    ports:
      - "8222:80"
    networks:
      - pi-utils-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/alive || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # portainer — Panel de administración de Docker para todo el clúster.
  # Servidor único (este nodo); se conecta a un portainer-agent en cada nodo
  # (incluido este mismo) para tener visión y control de todos los contenedores.
  # UI servida en HTTP interno (9000); TLS lo pone nginx en pi-dns.
  # Ver docs/10-instalacion-pi4-utils.md.
  # ---------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:2.42.0
    container_name: portainer
    restart: unless-stopped
    command: ["--http-enabled"]
    volumes:
      - /srv/homelab/pi-utils/portainer/data:/data
    ports:
      - "9000:9000"
    networks:
      - pi-utils-net
    # Sin healthcheck: la imagen portainer-ce no trae ni wget ni siquiera
    # /bin/sh (nada ejecutable salvo el propio binario /portainer) — un
    # healthcheck no puede ejecutarse ahí dentro, se quedaría "unhealthy"
    # para siempre aunque el servicio esté sano (mismo caso que
    # otel-collector en pi-obs). Nada depende de su estado "healthy": los
    # agentes se conectan hacia el servidor, no al revés.

  # ---------------------------------------------------------------------------
  # portainer-agent — Expone el Docker de ESTE nodo a Portainer (puerto 9001).
  # Igual que en el resto de nodos: uno por host, todos gestionados desde el
  # servidor de arriba.
  # ---------------------------------------------------------------------------
  portainer-agent:
    image: portainer/agent:2.42.0
    container_name: portainer-agent
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      AGENT_CLUSTER_ADDR: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - "9001:9001"
    networks:
      - pi-utils-net

  # ---------------------------------------------------------------------------
  # watchtower — Auto-actualiza SOLO los contenedores con la label
  # com.centurylinklabs.watchtower.enable=true (node-exporter, cadvisor,
  # portainer-agent) — servicios sin estado. vaultwarden, portainer, n8n-aux,
  # rsshub y markitdown-service NUNCA se auto-actualizan — ver
  # docs/16-mantenimiento-actualizaciones.md.
  # ---------------------------------------------------------------------------
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pi-utils-net

  # ---------------------------------------------------------------------------
  # promtail — Envía los logs de todos los contenedores de este nodo a Loki
  # (pi-obs), para verlos desde Grafana. Ver docs/04-servicios-comunes.md.
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /srv/homelab/pi-utils/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /srv/homelab/pi-utils/promtail/data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - pi-utils-net

networks:
  pi-utils-net:
    name: pi-utils-net
    driver: bridge

# Ficheros reales bajo /srv/homelab/pi-utils/capataz/secrets/ (chmod 644 —
# los contenedores corren como uid 10001, no como el usuario del host que
# hace el bind mount; documentado así por el propio Capataz). Nunca
# versionados — mismo criterio que cualquier ".env" real de este repo.
secrets:
  database_url:
    file: ./capataz/secrets/database_url
  redis_url:
    file: ./capataz/secrets/redis_url
  portainer_token:
    file: ./capataz/secrets/portainer_token
  cognito_client_secret:
    file: ./capataz/secrets/cognito_client_secret
  runner_ssh_private_key:
    file: ./capataz/secrets/runner_ssh_private_key
  runner_known_hosts:
    file: ./capataz/secrets/runner_known_hosts
  ansible_vault_password:
    file: ./capataz/secrets/ansible_vault_password
