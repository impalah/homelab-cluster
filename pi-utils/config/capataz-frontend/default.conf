# =============================================================================
# default.conf — override del nginx propio del contenedor capataz-frontend
# (frontend/nginx/default.conf del repo de Capataz, horneado en la imagen).
# Bind-mount de solo lectura sobre /etc/nginx/conf.d/default.conf — ver
# pi-utils/docker-compose.yml, servicio capataz-frontend.
#
# Única diferencia real frente al original: /api/ ya no reenvía a
# "http://api:8000" (requeriría extra_hosts: api -> host-gateway, atado a
# que capataz-api corra en ESTE mismo nodo físico) sino a
# "https://capataz-api.home.arpa" — el hostname real que ya expone pi-dns
# (ver pi-dns/config/nginx/nginx.conf), el mismo patrón que usa el propio
# capataz-api para referenciar otros servicios del clúster
# (CAPATAZ_PORTAINER_URL, CAPATAZ_GRAFANA_URL...). Sobrevive sin cambios el
# día que capataz-api/capataz-frontend acaben en nodos Swarm distintos
# (routing mesh sobre el mismo hostname) — ver docs/28.
#
# Tres detalles no obvios, los tres necesarios para que la petición llegue
# al bloque correcto de pi-dns (que sirve varios hostnames por el mismo
# puerto 443 vía SNI):
#
#   1. "resolver 127.0.0.11 + variable" en vez de un proxy_pass estático:
#      mismo motivo que pihole.home.arpa/apikey.home.arpa en el propio
#      nginx.conf de pi-dns — evita que este contenedor se niegue a
#      arrancar si la resolución DNS de capataz-api.home.arpa falla en el
#      instante exacto del arranque.
#   2. "proxy_ssl_server_name on": nginx NO manda SNI en conexiones
#      proxy_pass https:// salientes por defecto. Sin esto, pi-dns no sabe
#      qué certificado ni qué server{} servir y cae al primer server{}
#      "listen 443 ssl" del fichero (old.index.home.arpa) — probado en
#      real, rompía la llamada silenciosamente con contenido equivocado.
#   3. "proxy_set_header Host capataz-api.home.arpa" (fijo, NO $host):
#      nginx en pi-dns vuelve a mirar el header Host ya dentro de la
#      conexión TLS para elegir el server{} final, aunque el SNI ya haya
#      sido correcto — si se propagase el Host original de la petición del
#      navegador (index.home.arpa/home.404labo.net), pi-dns enrutaría al
#      bloque equivocado pese a tener el SNI bien.
# =============================================================================
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  resolver 127.0.0.11 valid=30s;
  set $capataz_api_backend capataz-api.home.arpa;

  location /api/ {
    proxy_ssl_server_name on;
    proxy_pass https://$capataz_api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host capataz-api.home.arpa;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection '';
    proxy_buffering off;
  }
  # Renderizado en cada arranque por /docker-entrypoint.d/40-render-runtime-config.sh
  # (envsubst), en un tmpfs separado del bundle estático de solo lectura —
  # ver docs/adr/007-runtime-frontend-config.en.md del repo de Capataz.
  location = /config.js { alias /config-runtime/config.js; add_header Cache-Control "no-store" always; }
  location / { try_files $uri $uri/ /index.html; }
}
