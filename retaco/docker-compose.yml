name: homelab-retaco

# =============================================================================
# Stack del nodo Retaco (192.168.1.174)
# Servicios: postgres-main, qdrant, n8n-main, registry, open-webui, open-terminal-mcp, valkey, postgres-infisical, infisical, authentik
#
# postgres-main y qdrant migrados desde ryzen (192.168.1.150) para liberar al
# Ryzen 9 de servicios de datos. n8n-main migrado después, para que las
# automatizaciones (cron, webhooks) sigan funcionando aunque el stack de IA
# de ryzen esté parado — retaco está siempre encendido, ryzen no. De paso,
# n8n-main vuelve a conectar a postgres-main por nombre de contenedor (red
# Docker local), ya no cross-host como durante la migración de solo datos.
# Ver docs/05-instalacion-retaco.md para el procedimiento de ambas migraciones.
#
# open-webui migrado después (docs/23-bifrost-gateway-llm.md), mismo motivo:
# sigue accesible con ryzen apagado. Habla solo con Bifrost (pi-sonar), no
# con Ollama directo — ver el comentario junto al propio servicio más abajo.
#
# open-terminal-mcp (mejora 17, docs/22-mejoras-futuras.md) en este mismo
# nodo por localidad: es quien consume el servidor MCP (Open WebUI y n8n-main
# ya viven aquí) y retaco tiene margen de sobra (~10 GiB libres de 13 GiB
# medidos en vivo antes de desplegarlo). Descartado ryzen/mole a petición
# expresa — no siempre está encendido. Detalle completo, incluida la razón
# de por qué va detrás de apikey-service, en docs/24-open-terminal-mcp.md.
#
# valkey (mejora 24, docs/22-mejoras-futuras.md) también en retaco: nodo de
# datos, ya aloja postgres-main/qdrant/registry. Sin persistencia (uso
# previsto hoy: solo caché), expuesto como valkey.home.arpa — ver
# comentario junto al propio servicio y docs/25-valkey-cache.md.
#
# infisical (mejora 16, docs/22-mejoras-futuras.md) también en retaco: NO
# comparte postgres-main (Postgres DEDICADO, "postgres-infisical" — ver
# docs/adr/0002-infisical-postgres-dedicado.md, motivo: aislar su radio de
# fallo del resto de servicios multi-tenant) y reutiliza el valkey ya
# desplegado (sin Redis dedicado), expuesto como infisical.home.arpa. Detalle
# completo, incluido cómo se inyectan los secretos en cada servicio migrado,
# en docs/26-infisical-secretos.md y docs/adr/0001-infisical-inyeccion-bind-mount-vs-imagen-derivada.md.
# =============================================================================

# Logs -> driver `loki` nativo de Docker en vez de Promtail (docs/31-docker-swarm.md,
# Fase 1) -- retaco es x86_64, el plugin sí funciona aquí (a diferencia de las
# Raspberry Pi, arm64, sin build del plugin).
x-logging: &loki-logging
  driver: loki
  options:
    loki-url: "http://192.168.1.171:3100/loki/api/v1/push"
    loki-external-labels: "node=retaco"
    mode: non-blocking
    max-buffer-size: 4m

services:

  # ---------------------------------------------------------------------------
  # postgres-main — MIGRADO al swarm (Fase 4, docs/31-docker-swarm.md,
  # 2026-08-27, el último de la fase). Fuente de verdad ahora:
  # docker-swarm/stacks/postgres-main/docker-compose.yml, pinnado con
  # `node.hostname==retaco` -- mismos datos, sin mover. Backup físico
  # completo ejecutado antes de migrar (data/ entero, no solo pg_dump por
  # base -- ver docs/31-docker-swarm.md). Todos los consumidores cross-nodo
  # (postgres-exporter en pi-obs, sonarqube en pi-sonar) ya usaban IP real o
  # el alias DNS postgresql.home.arpa, no un alias Docker -- sin cambios
  # ahí. Los consumidores locales de este mismo nodo (open-webui, n8n-main,
  # authentik) ya se migraron antes a IP real, ver sus propios comentarios.
  # Bloque retirado a propósito (no solo el contenedor parado), mismo
  # motivo que el resto de servicios migrados en esta fase.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # n8n-main — MIGRADO al swarm (Fase 4, docs/31-docker-swarm.md, 2026-08-27).
  # Fuente de verdad ahora: docker-swarm/stacks/n8n-main/docker-compose.yml,
  # pinnado con `node.hostname==retaco` -- mismos datos (workflows/
  # credenciales cifradas), sin mover. N8N_ENCRYPTION_KEY sigue viniendo de
  # Infisical exactamente igual, la migración de orquestador no la toca.
  # DB_POSTGRESDB_HOST pasó del alias de red Docker "postgres-main" a la IP
  # real (192.168.1.174) -- postgres-main sigue en Compose clásico (es el
  # último de la Fase 4), n8n-main ya no comparte red de proyecto con él.
  # Bloque retirado a propósito (no solo el contenedor parado), mismo motivo
  # que registry/qdrant.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # qdrant — MIGRADO al swarm (Fase 4, docs/31-docker-swarm.md, 2026-08-27).
  # Fuente de verdad ahora: docker-swarm/stacks/qdrant/docker-compose.yml,
  # pinnado con `node.hostname==retaco` -- mismos datos, sin mover. Bloque
  # retirado a propósito (no solo el contenedor parado) -- mismo motivo que
  # `registry`: la routing mesh de Swarm ya tiene el 6333 reservado en todos
  # los nodos del swarm, este incluido, y un `docker compose up -d` a secas
  # aquí (ya visto en vivo, al recrear open-webui) intenta resucitarlo y
  # choca. `open-webui` (más abajo) ya no lo referencia por el alias de red
  # Docker "qdrant" -- habla por IP:puerto real (192.168.1.174:6333).
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # registry — MIGRADO al swarm (Fase 4, docs/31-docker-swarm.md, 2026-08-27).
  # Fuente de verdad ahora: docker-swarm/stacks/registry/docker-compose.yml,
  # pinnado con `node.hostname==retaco` -- mismos datos
  # (/srv/homelab/retaco/registry/{data,auth}), mismo puerto 5000. Bloque
  # retirado a propósito (no solo el contenedor parado): dejarlo aquí sin más
  # sería resucitar el mismo choque de puerto que ya se vio en vivo con
  # Traefik/capataz-frontend si alguien lanza un `docker compose up -d` a
  # secas en este nodo -- la routing mesh de Swarm ya tiene el 5000 reservado
  # en todos los nodos del swarm, este incluido.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # epub2pdf-service / pdf2chunks-service — MIGRADOS al swarm (Fase 4,
  # docs/31-docker-swarm.md, 2026-08-27). Fuente de verdad ahora:
  # docker-swarm/stacks/epub2pdf-service/ y docker-swarm/stacks/
  # pdf2chunks-service/, ambos pinnados con `node.hostname==retaco`
  # -- OBLIGATORIO, no opcional: sus volúmenes son subcarpetas del montaje
  # NFS del NAS (ketekasko), que SOLO existe en retaco entre los 5 nodos del
  # swarm (confirmado antes de migrar). Bloque retirado a propósito, mismo
  # motivo que el resto de servicios migrados en esta fase.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # open-webui — MIGRADO al swarm (Fase 4, docs/31-docker-swarm.md,
  # 2026-08-27). Fuente de verdad ahora: docker-swarm/stacks/open-webui/
  # docker-compose.yml, pinnado con `node.hostname==retaco` -- mismos datos
  # (uploads/caché, 890M), sin mover. Backup previo ejecutado (805M
  # comprimido). Bloque retirado a propósito, mismo motivo que el resto de
  # servicios migrados en esta fase.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # open-terminal-mcp — MIGRADO al swarm (Fase 4, docs/31-docker-swarm.md,
  # 2026-08-27). Fuente de verdad ahora: docker-swarm/stacks/open-terminal-mcp/
  # docker-compose.yml, pinnado con `node.hostname==retaco` -- mismos datos
  # (/home/user), sin mover. Bloque retirado a propósito, mismo motivo que
  # el resto de servicios migrados en esta fase.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # node-exporter / cadvisor — migrados a Docker Swarm (mode: global),
  # docker-swarm/stacks/common/docker-compose.yml — ver docs/31-docker-swarm.md.
  # Ya no se despliegan aquí; Prometheus (pi-obs) los sigue scrapeando por la
  # misma IP:puerto que antes, sin cambios en su configuración.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # portainer-agent — migrado a Docker Swarm (mode: global, patrón oficial
  # agent-stack.yml), docker-swarm/stacks/portainer/ — ver docs/31-docker-swarm.md.
  # Ya no se despliega aquí.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # watchtower — Auto-actualiza SOLO los contenedores con la label
  # com.centurylinklabs.watchtower.enable=true (promtail) — servicios sin
  # estado. node-exporter/cadvisor/portainer-agent ya no están aquí (migrados
  # a Swarm, ver arriba); postgres-main, n8n-main y qdrant NUNCA se
  # auto-actualizan — ver docs/16-mantenimiento-actualizaciones.md.
  # ---------------------------------------------------------------------------
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    logging: *loki-logging
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - retaco-net

  # ---------------------------------------------------------------------------
  # promtail — migrado al driver de logging `loki` nativo de Docker (ver
  # x-logging arriba) — docs/31-docker-swarm.md. Ya no se despliega aquí.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # valkey — MIGRADO al swarm (Fase 4, docs/31-docker-swarm.md, 2026-08-27).
  # Fuente de verdad ahora: docker-swarm/stacks/valkey/docker-compose.yml,
  # pinnado con `node.hostname==retaco` -- preserva valkey.home.arpa sin
  # tocar el registro DNS. Sin persistencia (solo caché), sin backup que
  # hacer. Bloque retirado a propósito, mismo motivo que el resto de
  # servicios migrados en esta fase.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # postgres-infisical / infisical — MIGRADOS al swarm, JUNTOS en un solo
  # stack (Fase 4, docs/31-docker-swarm.md, 2026-08-27, el último de retaco).
  # Fuente de verdad ahora: docker-swarm/stacks/infisical/docker-compose.yml,
  # ambos pinnados con `node.hostname==retaco` -- mismos datos, sin mover.
  # Comparten red overlay para que el alias Docker "postgres-infisical"
  # (DB_CONNECTION_URI) siga resolviendo sin tocar el secreto -- mismo
  # criterio que authentik-server/worker o el stack de pi-obs. Backup físico
  # completo ejecutado antes de migrar (153M, 20M comprimido). Bloque
  # retirado a propósito, mismo motivo que el resto de servicios migrados en
  # esta fase.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # authentik-server / authentik-worker — MIGRADOS al swarm (Fase 4,
  # docs/31-docker-swarm.md, 2026-08-27). Fuente de verdad ahora:
  # docker-swarm/stacks/authentik/docker-compose.yml, ambos pinnados con
  # `node.hostname==retaco` -- mismos datos, sin mover. La BD "authentik" en
  # postgres-main tampoco se toca -- solo cambia cómo se alcanza (IP real en
  # vez del alias de red Docker "postgres-main", mismo criterio que
  # qdrant/n8n-main). Traefik ya apuntaba a 192.168.1.174:9000 de antes
  # (passthrough + forward-auth de prometheus.home.arpa) -- sin cambios ahí.
  # Bloque retirado a propósito (no solo los contenedores parados), mismo
  # motivo que el resto de servicios migrados en esta fase.
  # ---------------------------------------------------------------------------

networks:
  retaco-net:
    name: retaco-net
    driver: bridge
