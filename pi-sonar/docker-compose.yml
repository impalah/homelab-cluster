name: homelab-pi-sonar

# =============================================================================
# Stack del nodo pi-sonar (192.168.1.172)
# Servicios: sonarqube (Community Edition), bifrost (gateway LLM / AWS Bedrock)
#
# La base de datos (antes "sonarqube-db" local) se migró a postgres-main en
# retaco (192.168.1.174) — ver docs/05-instalacion-retaco.md. SonarQube se
# conecta cross-host, ya no por nombre de contenedor en pi-sonar-net.
#
# bifrost se añadió después (docs/23-bifrost-gateway-llm.md): nodo elegido
# porque SonarQube consume RAM solo a ráfagas (durante análisis), dejando
# margen real la mayor parte del tiempo, y porque aísla las credenciales de
# AWS del nodo más expuesto del clúster (pi-dns, puerta de entrada HTTPS +
# Tailscale) — ver la discusión completa en docs/22-mejoras-futuras.md punto 21.
#
# PREREQUISITOS obligatorios en el host antes de arrancar:
#   sysctl -w vm.max_map_count=524288
#   sysctl -w fs.file-max=131072
#   (persistir en /etc/sysctl.d/99-homelab-sonar.conf)
# =============================================================================

# Logs -> driver `loki` nativo de Docker en vez de Promtail (docs/31-docker-swarm.md,
# Fase 1) -- plugin arm64 oficial (grafana/loki-docker-driver:3.7.2-arm64), no
# ":latest" (no es un manifest multi-arch real, resuelve a x86_64 en Raspberry Pi).
x-logging: &loki-logging
  driver: loki
  options:
    loki-url: "http://192.168.1.171:3100/loki/api/v1/push"
    loki-external-labels: "node=pi-sonar"
    mode: non-blocking
    max-buffer-size: 4m

services:

  # ---------------------------------------------------------------------------
  # nut-upsmon — cliente NUT: monitoriza el SAI remoto en pi-obs
  # (192.168.1.171:3493) y apaga ESTE host si el SAI ordena un apagado por
  # bateria critica. Ver docs/33-nut-sai.md.
  #
  # privileged: true IMPRESCINDIBLE -- confirmado en vivo (pinchi,
  # 2026-09-01): sin el, AppArmor bloquea la conexion D-Bus al host real
  # ("AppArmor policy prevents this sender..."), y el apagado real fallaria
  # en silencio justo cuando mas falta hace.
  # ---------------------------------------------------------------------------
  nut-upsmon:
    build: /srv/homelab/shared/docker/nut-client
    image: nut-client:local
    container_name: nut-upsmon
    logging: *loki-logging
    restart: unless-stopped
    privileged: true
    environment:
      NUT_MONUSER_PASSWORD: ${NUT_MONUSER_PASSWORD}
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /srv/homelab/shared/config/nut/nut-client.conf:/etc/nut/nut.conf:ro
      - /srv/homelab/shared/config/nut/upsmon-client.conf.template:/etc/nut/upsmon.conf.template:ro
      - /srv/homelab/shared/scripts/nut-shutdown-host.sh:/usr/local/bin/nut-shutdown-host.sh:ro
      - /srv/homelab/shared/scripts/nut-notify.sh:/usr/local/bin/nut-notify.sh:ro
    networks:
      - pi-sonar-net

  # ---------------------------------------------------------------------------
  # sonarqube / bifrost — MIGRADOS al swarm (Fase 4, docs/31-docker-swarm.md,
  # 2026-08-27). Fuente de verdad ahora: docker-swarm/stacks/sonarqube/ y
  # docker-swarm/stacks/bifrost/, cada uno en su propio stack (no comparten
  # nada entre sí, sin alias de red cruzados), ambos pinnados con
  # `node.hostname==pi-sonar` -- mismos datos, sin mover. Ya usaban IP/alias
  # DNS reales (postgresql.home.arpa, 192.168.1.150 para Ollama), nunca alias
  # Docker -- sin ajustes de red necesarios. Backup previo de sonarqube
  # ejecutado (data/+extensions/, 314M); bifrost sin backup dedicado (su
  # estado real vive en postgres-main, /app/data no aloja datos reales, ya
  # documentado así en la copia clásica). Bloque retirado a propósito (no
  # solo los contenedores parados), mismo motivo que el resto de servicios
  # migrados en esta fase.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # node-exporter / cadvisor — migrados a Docker Swarm (mode: global),
  # docker-swarm/stacks/common/docker-compose.yml — ver docs/31-docker-swarm.md.
  # Ya no se despliegan aquí; Prometheus (pi-obs) los sigue scrapeando por la
  # misma IP:puerto que antes, sin cambios en su configuración.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # portainer-agent — migrado a Docker Swarm (mode: global, patrón oficial
  # agent-stack.yml), docker-swarm/stacks/portainer/ — ver docs/31-docker-swarm.md.
  # Ya no se despliega aquí.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # watchtower — Auto-actualiza SOLO los contenedores con la label
  # com.centurylinklabs.watchtower.enable=true — hoy ningún servicio de este
  # nodo la lleva. node-exporter/cadvisor/portainer-agent/promtail ya no
  # están aquí (migrados a Swarm/driver loki, ver arriba); sonarqube/bifrost
  # NUNCA se auto-actualizan — ver docs/16-mantenimiento-actualizaciones.md.
  # ---------------------------------------------------------------------------
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    logging: *loki-logging
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pi-sonar-net

  # ---------------------------------------------------------------------------
  # promtail — migrado al driver de logging `loki` nativo de Docker (ver
  # x-logging arriba) — docs/31-docker-swarm.md. Ya no se despliega aquí.
  # ---------------------------------------------------------------------------

networks:
  pi-sonar-net:
    name: pi-sonar-net
    driver: bridge
