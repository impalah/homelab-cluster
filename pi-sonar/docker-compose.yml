name: homelab-pi-sonar

# =============================================================================
# Stack del nodo pi-sonar (192.168.1.172)
# Servicios: sonarqube (Community Edition)
#
# La base de datos (antes "sonarqube-db" local) se migró a postgres-main en
# retaco (192.168.1.174) — ver docs/05-instalacion-retaco.md. SonarQube se
# conecta cross-host, ya no por nombre de contenedor en pi-sonar-net.
#
# PREREQUISITOS obligatorios en el host antes de arrancar:
#   sysctl -w vm.max_map_count=524288
#   sysctl -w fs.file-max=131072
#   (persistir en /etc/sysctl.d/99-homelab-sonar.conf)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # sonarqube — Plataforma de análisis de calidad de código
  # ---------------------------------------------------------------------------
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    environment:
      # postgres-main vive en retaco, no en este host — conexión cross-host
      # vía el alias directo postgresql.home.arpa (ver
      # shared/dns/dns-records.md, sección "Alias directos").
      SONAR_JDBC_URL: jdbc:postgresql://postgresql.home.arpa:5432/${SONARQUBE_DB_NAME:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONARQUBE_DB_USER:-sonarqube}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD}
      SONAR_WEB_JAVAOPTS: ${SONAR_WEB_JAVAOPTS:--Xmx512m -Xms128m}
      SONAR_CE_JAVAOPTS: ${SONAR_CE_JAVAOPTS:--Xmx512m -Xms128m}
      SONAR_SEARCH_JAVAOPTS: ${SONAR_SEARCH_JAVAOPTS:--Xmx1g -Xms1g -XX:MaxDirectMemorySize=256m}
      SONAR_CORE_SERVERBASEURL: ${SONAR_CORE_SERVERBASEURL:-https://sonarqube.home.arpa}
    volumes:
      - /srv/homelab/pi-sonar/sonarqube/data:/opt/sonarqube/data
      - /srv/homelab/pi-sonar/sonarqube/extensions:/opt/sonarqube/extensions
      - /srv/homelab/pi-sonar/sonarqube/logs:/opt/sonarqube/logs
      - /srv/homelab/pi-sonar/sonarqube/temp:/opt/sonarqube/temp
    ports:
      - "9000:9000"
    networks:
      - pi-sonar-net
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ---------------------------------------------------------------------------
  # node-exporter — Métricas del sistema host, scrapeadas por Prometheus en pi-obs
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: node-exporter
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - pi-sonar-net
    pid: host

  # ---------------------------------------------------------------------------
  # cadvisor — Métricas de contenedores Docker, scrapeadas por Prometheus en pi-obs
  # ---------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks:
      - pi-sonar-net
    privileged: true
    devices:
      - /dev/kmsg

  # ---------------------------------------------------------------------------
  # portainer-agent — Expone el Docker de este nodo a Portainer (servidor en
  # pi-utils). Ver docs/10-instalacion-pi4-utils.md.
  # ---------------------------------------------------------------------------
  portainer-agent:
    image: portainer/agent:2.42.0
    container_name: portainer-agent
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      AGENT_CLUSTER_ADDR: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - "9001:9001"
    networks:
      - pi-sonar-net

  # ---------------------------------------------------------------------------
  # watchtower — Auto-actualiza SOLO los contenedores con la label
  # com.centurylinklabs.watchtower.enable=true (node-exporter, cadvisor,
  # portainer-agent) — servicios sin estado. sonarqube NUNCA se
  # auto-actualiza — ver docs/16-mantenimiento-actualizaciones.md.
  # ---------------------------------------------------------------------------
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pi-sonar-net

networks:
  pi-sonar-net:
    name: pi-sonar-net
    driver: bridge
