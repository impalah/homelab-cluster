name: homelab-pi-obs

# =============================================================================
# Stack del nodo pi-obs (192.168.1.171)
# Servicios: otel-collector, prometheus, grafana, loki, tempo,
#            node-exporter, cadvisor, postgres-exporter
# =============================================================================

# Logs -> driver `loki` nativo de Docker en vez de Promtail (docs/31-docker-swarm.md,
# Fase 1) -- plugin arm64 oficial (grafana/loki-docker-driver:3.7.2-arm64), no
# ":latest" (no es un manifest multi-arch real, resuelve a x86_64 en Raspberry
# Pi). loki se manda logs a sí mismo -- mismo patrón que ya hacía Promtail.
x-logging: &loki-logging
  driver: loki
  options:
    loki-url: "http://192.168.1.171:3100/loki/api/v1/push"
    loki-external-labels: "node=pi-obs"
    mode: non-blocking
    max-buffer-size: 4m

services:

  # ---------------------------------------------------------------------------
  # loki / tempo / prometheus / otel-collector / grafana / postgres-exporter —
  # MIGRADOS al swarm, TODOS JUNTOS en un solo stack (Fase 4,
  # docs/31-docker-swarm.md, 2026-08-27). Fuente de verdad ahora:
  # docker-swarm/stacks/pi-obs/docker-compose.yml, los 6 pinnados con
  # `node.hostname==pi-obs` -- mismos datos, sin mover. Van juntos en un solo
  # stack (no seis stacks separados) porque grafana/otel-collector se
  # referencian entre sí por alias de red Docker (http://prometheus:9090,
  # http://loki:3100, http://tempo:3200/4317, http://postgres-exporter:9187) --
  # necesitan seguir compartiendo la misma red overlay para que esos alias
  # resuelvan, mismo criterio que authentik-server/worker. De paso corrige un
  # DNS de contenedor obsoleto en postgres-exporter (up=0 desde el 24-08,
  # nada que ver con esta migración -- se resuelve solo al recrear ambos
  # contenedores en la red nueva). Ningún consumidor externo (otros nodos)
  # cambia -- todos ya usaban IP real (192.168.1.171), nunca alias Docker.
  # Bloque retirado a propósito (no solo los contenedores parados), mismo
  # motivo que el resto de servicios migrados en esta fase.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # portainer-agent — migrado a Docker Swarm (mode: global, patrón oficial
  # agent-stack.yml), docker-swarm/stacks/portainer/ — ver docs/31-docker-swarm.md.
  # Ya no se despliega aquí.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # watchtower — Auto-actualiza SOLO los contenedores con la label
  # com.centurylinklabs.watchtower.enable=true (postgres-exporter) —
  # servicios sin estado. node-exporter/cadvisor/portainer-agent/promtail ya
  # no están aquí (migrados a Swarm/driver loki, ver arriba); Prometheus,
  # Grafana, Loki y Tempo NUNCA se auto-actualizan — ver
  # docs/16-mantenimiento-actualizaciones.md.
  # ---------------------------------------------------------------------------
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    logging: *loki-logging
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pi-obs-net

  # ---------------------------------------------------------------------------
  # promtail — migrado al driver de logging `loki` nativo de Docker (ver
  # x-logging arriba) — docs/31-docker-swarm.md. Ya no se despliega aquí.
  # ---------------------------------------------------------------------------

networks:
  pi-obs-net:
    name: pi-obs-net
    driver: bridge
