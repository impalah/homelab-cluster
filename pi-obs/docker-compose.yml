name: homelab-pi-obs

# =============================================================================
# Stack del nodo pi-obs (192.168.1.171)
# Servicios: otel-collector, prometheus, grafana, loki, tempo,
#            node-exporter, cadvisor, postgres-exporter
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # loki — Agregación de logs
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - /srv/homelab/pi-obs/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - /srv/homelab/pi-obs/loki/data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - pi-obs-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # tempo — Almacenamiento de trazas distribuidas
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.4.2
    container_name: tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - /srv/homelab/pi-obs/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - /srv/homelab/pi-obs/tempo/data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    networks:
      - pi-obs-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # prometheus — Base de datos de series temporales
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}"
      - "--web.enable-remote-write-receiver"
      - "--web.enable-lifecycle"
    volumes:
      - /srv/homelab/pi-obs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /srv/homelab/pi-obs/prometheus/data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - pi-obs-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # otel-collector — Receptor y enrutador de telemetría
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: otel-collector
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    command: ["--config=/etc/otel/otel-collector.yaml"]
    volumes:
      - /srv/homelab/pi-obs/otel/config/otel-collector.yaml:/etc/otel/otel-collector.yaml:ro
    ports:
      - "4317:4317"      # OTLP gRPC (recibe telemetría de otros nodos)
      - "4318:4318"      # OTLP HTTP
      - "127.0.0.1:8889:8889"   # métricas propias del collector (scrapeadas por Prometheus)
    networks:
      - pi-obs-net
    # Sin healthcheck: la imagen otel/opentelemetry-collector-contrib es
    # "distroless" (sin /bin/sh, sin wget/curl) — un healthcheck CMD-SHELL no
    # puede ejecutarse nunca ahí dentro, se quedaría en "starting"/fallando
    # para siempre aunque el proceso esté sano. Ningún otro servicio depende
    # de su estado "healthy" (nada lo referencia en depends_on), así que
    # "restart: unless-stopped" es suficiente para la recuperación ante caídas.

  # ---------------------------------------------------------------------------
  # grafana — Visualización y dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-https://grafana.home.arpa}
      GF_SERVER_DOMAIN: ${GF_SERVER_DOMAIN:-grafana.home.arpa}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_LOG_LEVEL: info
    volumes:
      - /srv/homelab/pi-obs/grafana/data:/var/lib/grafana
      - /srv/homelab/pi-obs/config/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - /srv/homelab/pi-obs/config/grafana/alerting/undervoltage.yml:/etc/grafana/provisioning/alerting/undervoltage.yml:ro
      - /srv/homelab/pi-obs/config/grafana/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - /srv/homelab/pi-obs/config/grafana/dashboards/json:/etc/grafana/provisioning/dashboards/json:ro
    ports:
      - "3000:3000"
    networks:
      - pi-obs-net
    user: "472"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # node-exporter — Métricas del sistema host
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: node-exporter
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      # Textfile collector: expone las métricas que escribe
      # check-image-updates.sh (docker_image_outdated) — ver
      # docs/16-mantenimiento-actualizaciones.md.
      - "--collector.textfile.directory=/host/textfile"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /srv/homelab/pi-obs/node-exporter-textfile:/host/textfile:ro
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - pi-obs-net
    pid: host

  # ---------------------------------------------------------------------------
  # cadvisor — Métricas de contenedores Docker
  # ---------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - pi-obs-net
    privileged: true
    devices:
      - /dev/kmsg

  # ---------------------------------------------------------------------------
  # postgres-exporter — Métricas de PostgreSQL (postgres-main en retaco)
  # ---------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN}
    ports:
      - "127.0.0.1:9187:9187"
    networks:
      - pi-obs-net

  # ---------------------------------------------------------------------------
  # portainer-agent — Expone el Docker de este nodo a Portainer (servidor en
  # pi-utils). Ver docs/10-instalacion-pi4-utils.md.
  # ---------------------------------------------------------------------------
  portainer-agent:
    image: portainer/agent:2.42.0
    container_name: portainer-agent
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      AGENT_CLUSTER_ADDR: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - "9001:9001"
    networks:
      - pi-obs-net

  # ---------------------------------------------------------------------------
  # watchtower — Auto-actualiza SOLO los contenedores con la label
  # com.centurylinklabs.watchtower.enable=true (node-exporter, cadvisor,
  # postgres-exporter, portainer-agent) — servicios sin estado. Prometheus,
  # Grafana, Loki y Tempo NUNCA se auto-actualizan — ver
  # docs/16-mantenimiento-actualizaciones.md.
  # ---------------------------------------------------------------------------
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pi-obs-net

networks:
  pi-obs-net:
    name: pi-obs-net
    driver: bridge
