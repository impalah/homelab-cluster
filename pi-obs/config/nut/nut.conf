# El paquete nut-server de Ubuntu bloquea upsd/upsmon si MODE=none (el
# valor por defecto de fabrica) -- confirmado en vivo: sin este fichero,
# ambos imprimen "disabled, please adjust the configuration" y salen sin
# arrancar, aunque el driver usbhid-ups ya este hablando bien con el SAI.
#
# netserver: este nodo tiene el SAI fisico (driver+upsd) Y ademas necesita
# aceptar clientes upsmon remotos de los otros 5 nodos -- es el modo
# correcto (standalone seria solo si nadie mas fuera a conectarse).
MODE=netserver
