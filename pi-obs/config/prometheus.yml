global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: homelab
    node: pi-obs

# 2026-10-08: retirados los jobs node-exporter/cadvisor de pi-obs, pi-sonar y
# pi-utils -- esos nodos salieron del Swarm (sus exporters eran tareas globales
# del stack `common`) y ya no exponen :9100/:8081. Siguen encendidos solo con
# nut-upsmon (protección del SAI); si algún día se quiere monitorizarlos, hay
# que poner node-exporter en Compose clásico como en pi-dns.
scrape_configs:

  # OTel Collector — métricas propias del collector
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          node: pi-obs


  # PostgreSQL Exporter — métricas de postgres-main (retaco)
  - job_name: postgres-retaco
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          node: retaco
          db: postgres-main

  # Qdrant — /metrics real (colecciones, puntos, latencia de búsqueda),
  # protegido por la misma API key que el resto de la API de Qdrant (acepta
  # "Authorization: Bearer <key>", confirmado en vivo -- no hace falta el
  # header "api-key" propietario). El valor real vive en Infisical
  # (/qdrant/, QDRANT__SERVICE__API_KEY) y aquí se referencia como un
  # secret de Swarm aparte (qdrant-metrics-token-v1) porque este contenedor
  # de Prometheus no tiene wrapper de infisical -- mismo valor, dos sitios,
  # ver docs/22-mejoras-futuras.md (mejora 45) para el procedimiento manual
  # de creación del secret (paso pendiente, no automatizado).
  - job_name: qdrant-retaco
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/qdrant-metrics-token
    static_configs:
      - targets: ["192.168.10.7:6333"]
        labels:
          node: retaco

  # NUT exporter — SAI fisico conectado por USB a pi-obs, ver docs/33-nut-sai.md.
  # metrics_path/params distintos del resto porque druggeri/nut_exporter expone
  # las metricas en /ups_metrics (no /metrics) y necesita el nombre de la UPS
  # como query param.
  - job_name: nut-exporter
    metrics_path: /ups_metrics
    static_configs:
      - targets: ["nut-exporter:9199"]
        labels:
          node: pi-obs
    params:
      ups: ["sai"]

  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ---------------------------------------------------------------------------
  # Scrape remoto de node-exporter y cadvisor en el resto de nodos del clúster.
  # Cada nodo publica node-exporter en :9100 y cadvisor en :8081 (host:contenedor
  # 8081:8080) — ver docs/14-monitorizacion-completa-cluster.md.
  # ---------------------------------------------------------------------------

  - job_name: node-exporter-ryzen
    static_configs:
      - targets: ["192.168.10.10:9100"]
        labels:
          node: ryzen

  - job_name: cadvisor-ryzen
    static_configs:
      - targets: ["192.168.10.10:8081"]
        labels:
          node: ryzen

  - job_name: node-exporter-retaco
    static_configs:
      - targets: ["192.168.10.7:9100"]
        labels:
          node: retaco

  - job_name: cadvisor-retaco
    static_configs:
      - targets: ["192.168.10.7:8081"]
        labels:
          node: retaco

  - job_name: node-exporter-pi-dns
    static_configs:
      - targets: ["192.168.10.2:9100"]
        labels:
          node: pi-dns

  - job_name: cadvisor-pi-dns
    static_configs:
      - targets: ["192.168.10.2:8081"]
        labels:
          node: pi-dns

  # pi-dns2 (mejora 55, antes pi-utils): DNS de respaldo. Solo node-exporter;
  # incluye las métricas de dns-guard.sh (textfile collector) que usan las
  # alertas de grafana/alerting/dns.yml.
  - job_name: node-exporter-pi-dns2
    static_configs:
      - targets: ["192.168.10.3:9100"]
        labels:
          node: pi-dns2



  - job_name: node-exporter-pinchi
    static_configs:
      - targets: ["192.168.10.8:9100"]
        labels:
          node: pinchi

  - job_name: cadvisor-pinchi
    static_configs:
      - targets: ["192.168.10.8:8081"]
        labels:
          node: pinchi

  - job_name: node-exporter-miugarita
    static_configs:
      - targets: ["192.168.10.9:9100"]
        labels:
          node: miugarita

  - job_name: cadvisor-miugarita
    static_configs:
      - targets: ["192.168.10.9:8081"]
        labels:
          node: miugarita
